// BIND 9 as a forwarder (RQ5 D1 recall runs): named.conf plus a forward-only zone for pd.pdlab. at the lab authority.
options {
  directory "/var/cache/bind";
  recursion yes;
  allow-query { any; };
  allow-recursion { any; };
  allow-query-cache { any; };
  dnssec-validation no;
  listen-on { any; };
  listen-on-v6 { none; };
};
zone "." { type hint; file "/conf/root.hints"; };
zone "pd.pdlab" { type forward; forward only; forwarders { 172.31.53.12; }; };
