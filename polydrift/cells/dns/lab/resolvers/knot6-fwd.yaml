# Knot Resolver 6 as a forwarder (RQ5 D1 recall runs): knot6.yaml plus forwarding of pd.pdlab. to the lab authority.
workers: 1
network:
  listen:
    - interface: 0.0.0.0@53
dnssec:
  enable: false
forward:
  - subtree: pd.pdlab
    servers: [172.31.53.12]
lua:
  script: |
    modules.load('hints > iterate')
    hints.root({ ['a.root.pdlab.'] = '172.31.53.10' })
