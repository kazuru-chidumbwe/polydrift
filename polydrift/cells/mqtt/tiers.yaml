# MQTT cell: axis -> tier, from the tier rule (manuscript 3.3). The consumer is every client of the broker: the
# acting client's next action, and what other clients receive. Each step is observed on every open connection.
# Status: DRAFT, not frozen. Edits are free until the cell's freeze commit.
cell: mqtt
profile: mqtt-default-v1
refusal_class: null   # MQTT's refusal is closing the connection, observed as status closed
axes:
  decision_class:
    tier: 1
    kappa: identity
    clause: "T1: the client's next action follows the reason class (classes.py)"
  packet_types:
    tier: 2
    kappa: identity
    clause: "T2: which control packets the acting client receives, in order, decides its protocol state"
  session_present:
    tier: 2
    kappa: identity
    clause: "T2: Session Present decides whether the client re-subscribes (MQTT 5.0 3.2.2.1.1)"
  granted:
    tier: 2
    kappa: identity
    clause: "T2: granted QoS per filter decides the delivery guarantee the subscriber gets (3.9.3)"
  deliveries:
    tier: 2
    kappa: deliveries
    clause: "T2: application messages other clients receive (topic, payload, QoS, retain); per client, unordered across topics"
  own_publishes:
    tier: 2
    kappa: deliveries
    clause: "T2: application messages the acting client receives (retained on subscribe, own messages without No Local)"
  forwarded_props:
    tier: 2
    kappa: forwarded_props
    clause: "T2: properties the server must forward unaltered (3.3.2.3): format indicator, content type, response topic, correlation data, user properties in order"
  peers_closed:
    tier: 2
    kappa: sorted_tuple
    clause: "T2: other clients whose connection the step closed (session take-over, will)"
  actor_closed:
    tier: 2
    kappa: identity
    clause: "T2: the acting client's connection is closed after the step's packets (3.2.2-7, 3.1.4-6): the client must reconnect"
  limit_violations:
    tier: 2
    kappa: sorted_tuple
    clause: "T2: received packets that break a limit the receiver announced (Maximum Packet Size 3.1.2-24, Topic Alias Maximum 3.1.2-26): a conforming client must treat them as a protocol error"
  publish_meta:
    tier: 2
    kappa: publish_meta
    clause: "T2: per received PUBLISH, DUP, subscription identifiers, message expiry as received, topic alias used (3.3.1, 3.3.2.3.3, 3.3.4): each drives the receiver's handling"
  connack_presence:
    tier: 2
    kappa: sorted_tuple
    clause: "T2: CONNACK properties whose presence a clause fixes (assigned client identifier 3.1.3-7, response information 3.1.2-28, authentication method 4.12.0-5/6); 'refused' for reason code >= 0x80"
  problem_info:
    tier: 3
    kappa: sorted_tuple
    clause: "T3: packet types other than PUBLISH, CONNACK and DISCONNECT that carried a Reason String or User Property (3.1.2-29); diagnostic text only"
  auth_packets:
    tier: 2
    kappa: identity
    clause: "T2: AUTH packets received, by reason code (4.12): an unexpected AUTH stalls a client without an authentication method"
  pid_reuse:
    tier: 2
    kappa: sorted_tuple
    clause: "T2: clients that received two unacknowledged QoS > 0 PUBLISH packets with one Packet Identifier (4.3.2-1, 4.3.3-1): the second is lost or mistaken for a duplicate"
  connack_reserved:
    tier: 2
    kappa: identity
    clause: "T2: CONNACK Acknowledge Flags bits 7-1 (3.2.2-1): a conforming client treats non-zero as malformed"
  disconnect_props:
    tier: 3
    kappa: sorted_tuple
    clause: "T3: property names in a server DISCONNECT (3.14.2-2)"
  ack_ids:
    tier: 2
    kappa: identity
    clause: "T2: Packet Identifiers of acknowledgements received (4.3.2-4, 4.3.3-8/11): a wrong identifier leaves the client's flow open"
  pubrel_matches:
    tier: 2
    kappa: identity
    clause: "T2: each PUBREL received carries the identifier of the delivered QoS 2 PUBLISH (4.3.3-4)"
  arrival_order:
    tier: 2
    kappa: identity
    clause: "T2: order in which each client receives application messages (4.6 ordered topics)"
  dollar_topics:
    tier: 2
    kappa: sorted_tuple
    clause: "T2: topics beginning with $ received through wildcard filters (4.7.2-1); security-relevant ($SYS leak)"
  native_codes:
    tier: 3
    kappa: identity
    clause: "T3: reason codes within their decision class"
  connack_props:
    tier: 3
    kappa: connack_props
    clause: "T3: CONNACK properties other than announced configuration (Reason String, User Property, Server Reference, Response Information); the assigned client identifier is compared as present/absent"
  announced_config:
    tier: 3
    kappa: connack_props
    clause: "not compared (3.2): limits and capabilities the broker announces from its configuration (Receive Maximum, Maximum QoS, Retain Available, Maximum Packet Size, Topic Alias Maximum, the three availability flags, Session Expiry Interval, Server Keep Alive); recorded and reported per broker"
  retained_after:
    tier: 2
    kappa: deliveries
    end_state: true
    clause: "T2: the retained store as a new subscriber sees it after the fixture (end state)"
  deliveries_total:
    tier: 2
    kappa: deliveries
    end_state: true
    clause: "T2: deliveries to other clients summed over the fixture, for clauses that fix the delivery but not its step (4.3.3)"
