# PowerDNS Recursor 5.x as a forwarder (RQ5 D1 recall runs): recursor.yml plus forward_zones_recurse for pd.pdlab.
# (forwarding to a resolver, the ResolverFuzz RC3 setting) at the lab authority.
recursor:
  hint_file: /conf/root.hints
  forward_zones_recurse:
    - zone: pd.pdlab
      forwarders: [172.31.53.12]
dnssec:
  validation: "off"
incoming:
  allow_from: [0.0.0.0/0]
outgoing:
  dont_query: []
