# SIP behaviour cell (sipb): axis -> tier (manuscript 3.3). The consumer is every party around the element: the
# UAC that sent the request and the UAs it is forwarded to. Status: DRAFT, not frozen.
cell: sipb
axes:
  decision_class:
    tier: 1
    clause: "T1: the UAC's next action follows the class of the first final response (2xx proceed, 3xx redirect, 401/407 authenticate, 4xx fix-request, 5xx retry-later, 6xx stop, none no-response)"
  codes:
    tier: 2
    clause: "T2: status codes each party received in the step, provisional and final, in order (RFC 3261 8.1.3, 16.7)"
  requests:
    tier: 2
    clause: "T2: request methods each party received in the step (what the element forwarded, generated or retransmitted)"
  x1:
    tier: 2
    clause: "T2: fixture-named observation 1 (the step's extract expression names the header or field and the clause; random values such as branches and tags are compared through functions, never raw)"
  x2:
    tier: 2
    clause: "T2: fixture-named observation 2"
  x3:
    tier: 2
    clause: "T2: fixture-named observation 3"
  x4:
    tier: 2
    clause: "T2: fixture-named observation 4"
  x5:
    tier: 2
    clause: "T2: fixture-named observation 5"
  x6:
    tier: 2
    clause: "T2: fixture-named observation 6"
  x7:
    tier: 2
    clause: "T2: fixture-named observation 7"
  x8:
    tier: 2
    clause: "T2: fixture-named observation 8"
volatile: []
