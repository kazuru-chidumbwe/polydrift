[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polydrift"
version = "0.4.0.dev0"
description = "Differential testing of independent protocol implementations; SIP cell with stub and laboratory drivers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seke Kazuru", email = "kazuruuni@gmail.com" }]
keywords = ["differential-testing", "protocol-implementations", "test-oracle", "interoperability", "sip"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
polydrift = "polydrift.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polydrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
