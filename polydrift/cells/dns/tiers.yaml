# DNS cell: axis -> tier (manuscript 3.3). Consumer: the stub resolver and the
# application behind it.
# Status: DRAFT, not deposited. First use: re-expressing the StackDiff
# role-consistency oracle against core/. The peer-resolver fixtures add axes
# when the cell is built.
cell: dns
profile: dns-default-v1
refusal_class: null
axes:
  decision_class:
    tier: 1
    kappa: identity
    clause: "T1: the stub's next action follows the class (classes.py)"
  response_type:
    tier: 2
    kappa: identity
    clause: "T2: NXDOMAIN denies the name, NODATA one type; the stub caches different negative answers (RFC 2308)"
  answers:
    tier: 2
    kappa: rrset
    clause: "T2: the answer RRset is the data the application receives; RRsets are unordered (RFC 2181 5)"
  native_code:
    tier: 3
    kappa: identity
    clause: "T3: the RCODE within its class"
  aa:
    tier: 3
    kappa: identity
    clause: "T3: a stub acts the same on an answer whatever its AA flag"
  ra:
    tier: 3
    kappa: identity
    clause: "T3: RA does not change what a stub does with an answer it received"
  additional:
    tier: 3
    kappa: additional
    clause: "T3 for the stub; glue acceptance is observed as cache content (end state)"
  tc:
    tier: 2
    kappa: identity
    clause: "T2: a truncated reply makes the stub repeat the query over TCP (RFC 2181 9); the class records it as no-decision"
  ad:
    tier: 3
    kappa: identity
    clause: "T3: on unsigned lab zones the stub has nothing to act on; AD set without validation is a probe finding"
  authority_soa:
    tier: 3
    kappa: identity
    clause: "T3: the SOA in a negative answer sets how long a downstream cache keeps it (RFC 2308 5); the stub itself does not act on it"
  edns:
    tier: 3
    kappa: identity
    clause: "T3: OPT present in the reply; an EDNS client may fall back without it (RFC 6891 7)"
  glue_cache_accept:
    tier: 2
    kappa: identity
    end_state: true
    clause: "T2: what the resolver will serve later from its cache (end-state probe, security)"
  z_bit:
    tier: 2
    kappa: identity
    clause: "T2: Z must be zero in every response (RFC 1035 4.1.1); a strict stub drops the reply otherwise"
  rd:
    tier: 3
    kappa: identity
    clause: "T3: RD copied into the response (RFC 1035 4.1.1)"
  qname_case:
    tier: 3
    kappa: identity
    clause: "T3: question name as returned, case kept (RFC 1034 3.1, RFC 1035 2.3.3); 0x20 clients compare it"
  dname_compressed:
    tier: 3
    kappa: identity
    clause: "T3: a DNAME target sent in compressed form (RFC 6672 2.5); a downstream resolver that treats DNAME RDATA as uncompressed misreads it"
  synth_ttl_follows:
    tier: 3
    kappa: identity
    clause: "T3: the synthesized CNAME carries the cached DNAME's TTL (RFC 6672 3.1); how long the stub caches the synthesized name"
  answer_ttls:
    tier: 3
    kappa: ttl_classes
    clause: "T3: distinct TTLs in the answer section, each as the lab TTL it is ageing from (RFC 2181 5.2, 8; RFC 6672 3.1); how long the stub caches"
  additional_soa:
    tier: 3
    kappa: identity
    clause: "T3: SOA in the additional section of a non-authoritative answer (RFC 1034 4.3.4)"
  upstream_count:
    tier: 2
    kappa: identity
    clause: "T2: queries the resolver sent to the lab authorities per name and type: caching and retry clauses (RFC 1034 4.3.1, 5.3.3; RFC 1035 7.2, 7.4; RFC 2308)"
  upstream_volume:
    tier: 2
    kappa: identity
    clause: "T2: upstream queries for one client query in buckets 0, 1-3, 4-10, 11-30, >30 (resource consumption: RFC 1035 7.2, RFC 1034 5.3.3 retry bounds); only where a fixture step asks for it"
  upstream_rd:
    tier: 2
    kappa: identity
    clause: "T2: RD values the resolver sent upstream (RFC 1034 4.3.1: no recursion unless asked)"
  upstream_opt_codes:
    tier: 2
    kappa: identity
    clause: "T2: EDNS option codes the resolver sent upstream (RFC 6891 6.1.1, 6.2.6: client options are not forwarded)"
  upstream_edns:
    tier: 3
    kappa: identity
    clause: "T3: EDNS versions (-1 none) the resolver used upstream (RFC 6891 6.2.2, 7 fallback)"
  upstream_payloads:
    tier: 3
    kappa: identity
    clause: "T3: advertised UDP sizes in order of first use (RFC 6891 6.2.3, 6.2.5)"
  upstream_transports:
    tier: 3
    kappa: identity
    clause: "T3: UDP and TCP used upstream (RFC 2181 9 retry over TCP)"
  upstream_servers:
    tier: 3
    kappa: identity
    clause: "T3: lab authorities queried, in order of first use (RFC 1035 7.2 server selection)"
  parallel_order:
    tier: 2
    kappa: identity
    clause: "T2: order in which concurrent queries were answered; a resolver that serialises them delays every client (RFC 1034 2.4, RFC 1035 6.1.1)"
  parallel_latency:
    tier: 3
    kappa: identity
    clause: "T3: latency bucket of each concurrent query"
  parallel_rcodes:
    tier: 2
    kappa: identity
    clause: "T2: result code of each concurrent query"
  tcp_rcodes:
    tier: 2
    kappa: identity
    clause: "T2: result of each query on one TCP connection, 'closed' when the server closed it (RFC 1035 4.2.2)"
  tcp_open_after:
    tier: 2
    kappa: identity
    clause: "T2: the TCP connection was still open after the last query (RFC 1035 4.2.2 idle closing)"
  upstream_local_opts:
    tier: 2
    kappa: identity
    clause: "T2: a client EDNS option (local range 65001-65534) reached the authorities (RFC 6891 6.1.1: OPT not forwarded)"
volatile: []
