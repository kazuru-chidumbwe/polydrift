# DNS cell lab tree (manuscript 4.5). Internal network 172.31.53.0/24, no route out.
# root .10 (.), test .11 (pdlab.), pd .12 (pd.pdlab.), dead .13 (no server), other .14 (other.pdlab.),
# half .15 (halflame.pdlab.), resolver under test .53, client .99.
# Every zone is unsigned; resolvers run with validation off for the lab root (the only deviation besides root hints,
# query access and, for PowerDNS Recursor, permission to query private addresses).
servers:
  root:
    ip: 172.31.53.10
    zone: "."
    records:
      - ". 86400 SOA a.root.pdlab. host.pdlab. 1 3600 600 86400 300"
      - ". 86400 NS a.root.pdlab."
      - "a.root.pdlab. 86400 A 172.31.53.10"
      - "pdlab. 86400 NS ns.pdlab."
      - "ns.pdlab. 86400 A 172.31.53.11"
  pdlab:
    ip: 172.31.53.11
    zone: "pdlab."
    records:
      - "@ 3600 SOA ns.pdlab. host.pdlab. 1 3600 600 86400 300"
      - "@ 3600 NS ns.pdlab."
      - "ns 3600 A 172.31.53.11"
      - "a.root 3600 A 172.31.53.10"
      - "pd 3600 NS ns.pd"
      - "ns.pd 3600 A 172.31.53.12"
      - "other 3600 NS ns.other"
      - "ns.other 3600 A 172.31.53.14"
      - "lame 3600 NS ns.lame"
      - "ns.lame 3600 A 172.31.53.13"
      - "halflame 3600 NS ns1.halflame"
      - "halflame 3600 NS ns2.halflame"
      - "ns1.halflame 3600 A 172.31.53.13"
      - "ns2.halflame 3600 A 172.31.53.15"
  pd:
    ip: 172.31.53.12
    zone: "pd.pdlab."
    records:
      - "@ 3600 SOA ns.pd.pdlab. host.pd.pdlab. 1 3600 600 86400 5"
      - "@ 3600 NS ns"
      - "ns 3600 A 172.31.53.12"
      - "ok 300 A 10.0.0.1"
      - "a 300 A 10.0.0.2"
      - "a2 300 A 10.0.0.22"
      - "v6 300 AAAA fd00::2"
      - "txt 300 TXT \"polydrift\""
      - "mx 300 MX 10 mail.pd.pdlab."
      - "mail 300 A 10.0.0.3"
      - "c1 300 CNAME a"
      - "cout 300 CNAME target.other.pdlab."
      - "cnx 300 CNAME nothere"
      - "loop1 300 CNAME loop2"
      - "loop2 300 CNAME loop1"
      - "l1 300 CNAME l2"
      - "l2 300 CNAME l3"
      - "l3 300 CNAME l4"
      - "l4 300 CNAME l5"
      - "l5 300 CNAME l6"
      - "l6 300 CNAME l7"
      - "l7 300 CNAME l8"
      - "l8 300 CNAME l9"
      - "l9 300 CNAME l10"
      - "l10 300 CNAME l11"
      - "l11 300 CNAME l12"
      - "l12 300 A 10.0.0.12"
      - "dn 300 DNAME dtarget.other.pdlab."
      - "*.wild 300 A 10.0.1.1"
      - "a.b.ent 300 A 10.0.2.1"
      - "ttl0 0 A 10.0.3.1"
      - "unk 300 TYPE65280 \\# 4 0a000001"
      - "trunc 300 A 10.0.4.1"
      - "ednsfe 300 A 10.0.6.1"
      - "flip 300 A 10.0.7.1"
      - "poison 300 A 10.0.8.1"
      - "addpoison 300 A 10.0.8.2"
      - "inbail 300 A 10.0.8.3"
      - "qid 300 A 10.0.9.1"
      - "qmis 300 A 10.0.9.2"
      - "big 300 TXT \"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\" \"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb\" \"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc\" \"dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd\" \"eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee\" \"ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff\""
    behaviours:
      formerr: {kind: rcode, rcode: FORMERR}
      servfail: {kind: rcode, rcode: SERVFAIL}
      refused: {kind: rcode, rcode: REFUSED, aa: false}
      notimp: {kind: rcode, rcode: NOTIMP}
      trunc: {kind: truncate_udp}
      noaa: {kind: answer, answer: ["noaa.pd.pdlab. 300 A 10.0.5.1"], noaa: true}
      ednsfe: {kind: edns_formerr}
      flip: {kind: flip, negative_first: 1}
      poison: {kind: extra_answer, answer: ["victim.other.pdlab. 300 A 6.6.6.6"]}
      addpoison: {kind: extra_additional, additional: ["victim2.other.pdlab. 300 A 6.6.6.7"]}
      inbail: {kind: extra_additional, additional: ["a2.pd.pdlab. 300 A 6.6.6.8"]}
      qid: {kind: qid_mismatch}
      qmis: {kind: question_mismatch, qname: "zzz.pd.pdlab."}
      nx8020: {below: {kind: synth_a, ip: 10.80.20.1}}
  other:
    ip: 172.31.53.14
    zone: "other.pdlab."
    records:
      - "@ 3600 SOA ns.other.pdlab. host.other.pdlab. 1 3600 600 86400 300"
      - "@ 3600 NS ns"
      - "ns 3600 A 172.31.53.14"
      - "target 300 A 10.9.9.9"
      - "x.dtarget 300 A 10.9.8.1"
      - "victim 300 A 10.9.0.1"
      - "victim2 300 A 10.9.0.2"
  half:
    ip: 172.31.53.15
    zone: "halflame.pdlab."
    records:
      - "@ 3600 SOA ns2.halflame.pdlab. host.halflame.pdlab. 1 3600 600 86400 300"
      - "@ 3600 NS ns1"
      - "@ 3600 NS ns2"
      - "ns1 3600 A 172.31.53.13"
      - "ns2 3600 A 172.31.53.15"
      - "x 300 A 10.10.0.1"
