# polydrift sipb: OpenSIPS 3.6 as a stateful proxy and registrar for lab.test (the same role as kamailio.cfg; a
# declared lineage relative of Kamailio, not counted toward the independent minimum). Defaults kept where the role
# allows; lab-only: no authentication, no NAT, in-memory location table.

log_level=3
stderror_enabled=yes
syslog_enabled=no
udp_workers=2
tcp_workers=2
# listen on the EUT address (runner EUT_IP): with 0.0.0.0 the element put sip:0.0.0.0 into Record-Route
socket=udp:172.31.60.10:5060
socket=tcp:172.31.60.10:5060
alias="lab.test"

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "sipmsgops.so"
loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"

modparam("usrloc", "working_mode_preset", "single-instance-no-db")
modparam("rr", "append_fromtag", 1)
modparam("registrar", "max_expires", 3600)

route {
	if (!mf_process_maxfwd_header(70)) {
		send_reply(483, "Too Many Hops");
		exit;
	}
	# Same request validation as the Kamailio lab script, whose sanity_check() refuses an unsupported Proxy-Require
	# option (sanity module, empty proxy_require list): the lab proxy supports no extensions, so any Proxy-Require
	# gets 420 with the options in Unsupported (RFC 3261 8.2.2.3, 16.3). ACK and CANCEL are not refused.
	if (!is_method("ACK|CANCEL") && is_present_hf("Proxy-Require")) {
		append_to_reply("Unsupported: $hdr(Proxy-Require)\r\n");
		send_reply(420, "Bad Extension");
		exit;
	}
	if (has_totag()) {
		if (loose_route()) {
			if (is_method("INVITE")) {
				record_route();
			}
			route(relay);
			exit;
		}
		if (is_method("ACK")) {
			if (t_check_trans()) {
				t_relay();
			}
			exit;
		}
		send_reply(404, "Not here");
		exit;
	}
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			t_relay();
		}
		exit;
	}
	t_check_trans();
	if (loose_route()) {
		send_reply(403, "Preloaded Route denied");
		exit;
	}
	if (is_method("INVITE|SUBSCRIBE|REFER")) {
		record_route();
	}
	if (is_method("REGISTER") && is_myself("$rd")) {
		if (!save("location")) {
			sl_reply_error();
		}
		exit;
	}
	if (is_method("OPTIONS") && is_myself("$rd") && $rU == NULL) {
		send_reply(200, "OK");
		exit;
	}
	if ($rU == NULL) {
		send_reply(484, "Address Incomplete");
		exit;
	}
	if (is_myself("$rd")) {
		if (!lookup("location")) {
			t_reply(404, "Not Found");
			exit;
		}
	}
	route(relay);
}

route[relay] {
	if (!t_relay()) {
		send_reply(500, "Internal Error");
	}
	exit;
}
