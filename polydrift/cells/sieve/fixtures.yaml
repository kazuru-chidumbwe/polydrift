# Sieve fixtures (manuscript 3.1, 4.4, 4.5). Each fixture is one script run on one message (lab/messages) with an
# envelope and a set of existing folders. Every engine run gives two records: `<id>` (compile and intent, all
# engines) and `<id>@effect` (where the message ended up and what was sent, engines that execute). spec_refs name
# ledger rows (ledger/sieve.ledger.csv); `layer: effect` refs apply to the @effect record. Fixtures without
# spec_refs probe behaviour the RFCs leave open.
# Status: first batch (11 Nov 2026).
cell: sieve
defaults: {from: attacker@example.invalid, to: user@lab.test, folders: [INBOX]}

fixtures:

  # ---------------- controls ----------------
  empty_script_keeps:
    kind: control
    message: clean.eml
    script: |
      # nothing: implicit keep

  explicit_keep:
    kind: control
    message: clean.eml
    script: |
      keep;

  fileinto_existing:
    kind: control
    message: phishing.eml
    folders: [INBOX, INBOX.Quarantine]
    script: |
      require "fileinto";
      fileinto "INBOX.Quarantine";

  discard_plain:
    kind: control
    message: clean.eml
    script: |
      discard;

  # ---------------- core actions and require ----------------
  redirect_without_require:
    kind: probe
    message: review.eml
    spec_refs:
      - {req_id: SIEVE-49748ec9, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    script: |
      redirect "review@example.invalid";

  require_unknown_extension:
    kind: probe
    message: clean.eml
    spec_refs:
      - {req_id: SIEVE-51cd7779, keyword: MUST, axis: decision_class, step: 1, allowed: [fix-request]}
    script: |
      require "x-pd-no-such-extension";
      keep;

  fileinto_without_require:
    kind: probe
    message: phishing.eml
    folders: [INBOX, INBOX.Quarantine]
    spec_refs:
      - {req_id: SIEVE-42a6156f, keyword: MUST, axis: decision_class, step: 1, allowed: [fix-request]}
    script: |
      fileinto "INBOX.Quarantine";

  require_after_command:
    kind: probe
    message: clean.eml
    spec_refs:
      - {req_id: SIEVE-8506f896, keyword: MUST, axis: decision_class, step: 1, allowed: [fix-request]}
    script: |
      keep;
      require "fileinto";

  elsif_without_if:
    kind: probe
    message: clean.eml
    spec_refs:
      - {req_id: SIEVE-cf55c106, keyword: MUST, axis: decision_class, step: 1, allowed: [fix-request]}
    script: |
      elsif true { keep; }

  # ---------------- fileinto ----------------
  fileinto_missing_folder:
    kind: security
    message: phishing.eml
    spec_refs:
      - {req_id: SIEVE-1ebcd14f, keyword: MAY, axis: stored, step: 1, layer: effect,
         allowed: [[[INBOX, 1]], [[INBOX.Quarantine, 1]]]}
    script: |
      require "fileinto";
      if header :contains "subject" "verify your account" {
        fileinto "INBOX.Quarantine";
        stop;
      }

  fileinto_twice_same_folder:
    kind: probe
    message: phishing.eml
    folders: [INBOX, INBOX.Quarantine]
    spec_refs:
      - {req_id: SIEVE-adce47a5, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
      - {req_id: SIEVE-6184b5d0, keyword: SHOULD, axis: stored, step: 1, layer: effect, allowed: [[[INBOX.Quarantine, 1]]]}
    script: |
      require "fileinto";
      fileinto "INBOX.Quarantine";
      fileinto "INBOX.Quarantine";

  # ---------------- discard, redirect ----------------
  discard_is_silent:
    kind: probe
    message: phishing.eml
    spec_refs:
      - {req_id: SIEVE-ce7edc23, keyword: MUST, axis: emitted, step: 1, layer: effect, allowed: [[]]}
    script: |
      discard;

  redirect_keeps_nothing:
    kind: probe
    message: review.eml
    script: |
      redirect "review@example.invalid";

  # ---------------- tests ----------------
  core_tests_combined:
    kind: probe
    message: phishing.eml
    folders: [INBOX, INBOX.Quarantine]
    spec_refs:
      - {req_id: SIEVE-40f39d16, keyword: MUST, axis: intent, step: 1, allowed: [[fileinto:INBOX.Quarantine]]}
    script: |
      require "fileinto";
      if allof (exists "subject", not false, anyof (true, header :is "x-none" "y"),
                address :domain :is "from" "example.invalid", size :under 1M) {
        fileinto "INBOX.Quarantine";
      }

  comparator_octet_case:
    kind: probe
    message: phishing.eml
    folders: [INBOX, INBOX.Quarantine]
    spec_refs:
      - {req_id: SIEVE-7670d657, keyword: MUST, axis: intent, step: 1, allowed: [[keep]]}
    script: |
      require "fileinto";
      if header :comparator "i;octet" :contains "subject" "VERIFY" {
        fileinto "INBOX.Quarantine";
      }

  size_suffix_k:
    kind: probe
    message: big.eml
    folders: [INBOX, INBOX.Big]
    spec_refs:
      - {req_id: SIEVE-624f0acf, keyword: MAY, axis: intent, step: 1, allowed: [[fileinto:INBOX.Big]]}
    script: |
      require "fileinto";
      if size :over 10K { fileinto "INBOX.Big"; }

  invalid_header_name:
    kind: probe
    message: clean.eml
    spec_refs:
      - {req_id: SIEVE-dc9654cd, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    script: |
      if header :contains "bad header:name" "x" { discard; }

  encoded_subject_match:
    kind: probe
    message: encoded.eml
    folders: [INBOX, INBOX.Bills]
    spec_refs:
      - {req_id: SIEVE-9aba2c0b, keyword: SHOULD, axis: intent, step: 1, allowed: [[fileinto:INBOX.Bills]]}
      - {req_id: SIEVE-f9611ce8, keyword: MUST, axis: intent, step: 1, allowed: [[fileinto:INBOX.Bills]]}
    script: |
      require "fileinto";
      if header :contains "subject" "überfällig" { fileinto "INBOX.Bills"; }

  nesting_fifteen:
    kind: probe
    message: clean.eml
    spec_refs:
      - {req_id: SIEVE-a3f32976, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    script: |
      if true { if true { if true { if true { if true { if true { if true { if true {
      if true { if true { if true { if true { if true { if true { if true { keep; }
      } } } } } } } } } } } } } }

  envelope_from_test:
    kind: probe
    message: return-path.eml
    folders: [INBOX, INBOX.Quarantine]
    spec_refs:
      - {req_id: SIEVE-2f9e4407, keyword: SHOULD, axis: intent, step: 1, allowed: [[fileinto:INBOX.Quarantine]]}
    script: |
      require ["envelope", "fileinto"];
      if envelope :is "from" "attacker@example.invalid" { fileinto "INBOX.Quarantine"; }

  body_contains:
    kind: probe
    message: phishing.eml
    folders: [INBOX, INBOX.Quarantine]
    script: |
      require ["body", "fileinto"];
      if body :text :contains "Click here" { fileinto "INBOX.Quarantine"; }

  # ---------------- reject (RFC 5429) ----------------
  reject_phishing:
    kind: security
    message: phishing.eml
    spec_refs:
      - {req_id: SIEVE-b8699dab, keyword: MUST, axis: emitted, step: 1, layer: effect,
         allowed: [[[reject, [attacker@example.invalid]]]]}
    script: |
      require "reject";
      if header :contains "subject" "verify your account" {
        reject "Message rejected by local policy.";
      }

  reject_twice:
    kind: probe
    message: phishing.eml
    spec_refs:
      - {req_id: SIEVE-d2744728, keyword: MUST, axis: outcome, step: 1, allowed: [refused, runtime-error]}
    script: |
      require "reject";
      reject "one";
      reject "two";

  reject_with_vacation:
    kind: probe
    message: to-user.eml
    spec_refs:
      - {req_id: SIEVE-873ba023, keyword: MUST, axis: outcome, step: 1, allowed: [refused, runtime-error]}
    script: |
      require ["reject", "vacation"];
      vacation "Away.";
      reject "No.";

  ereject_phishing:
    kind: probe
    message: phishing.eml
    script: |
      require "ereject";
      ereject "Rejected at delivery.";

  # ---------------- vacation (RFC 5230) ----------------
  vacation_addressed:
    kind: probe
    message: to-user.eml
    spec_refs:
      - {req_id: SIEVE-34b25e13, keyword: SHOULD, axis: emitted, step: 1, layer: effect,
         allowed: [[[vacation, [alice@example.invalid]]]]}
    script: |
      require "vacation";
      vacation :days 1 "I am away.";

  vacation_not_addressed:
    kind: probe
    message: not-addressed.eml
    spec_refs:
      - {req_id: SIEVE-28a0229e, keyword: MUST, axis: emitted, step: 1, layer: effect, allowed: [[]]}
    script: |
      require "vacation";
      vacation :days 1 "I am away.";

  vacation_mailer_daemon:
    kind: probe
    message: daemon.eml
    spec_refs:
      - {req_id: SIEVE-49ac459c, keyword: MUST, axis: emitted, step: 1, layer: effect, allowed: [[]]}
    script: |
      require "vacation";
      vacation :days 1 "I am away.";

  vacation_list_message:
    kind: probe
    message: list.eml
    spec_refs:
      - {req_id: SIEVE-af3c6889, keyword: SHOULD, axis: emitted, step: 1, layer: effect, allowed: [[]]}
    script: |
      require "vacation";
      vacation :days 1 "I am away.";

  vacation_auto_submitted:
    kind: probe
    message: autosub.eml
    spec_refs:
      - {req_id: SIEVE-99ca3d1a, keyword: SHOULD, axis: emitted, step: 1, layer: effect, allowed: [[]]}
    script: |
      require "vacation";
      vacation :days 1 "I am away.";

  vacation_twice:
    kind: probe
    message: to-user.eml
    spec_refs:
      - {req_id: SIEVE-b48950f0, keyword: MUST, axis: outcome, step: 1, allowed: [refused, runtime-error]}
    script: |
      require "vacation";
      vacation "One.";
      vacation "Two.";

  vacation_with_fileinto:
    kind: probe
    message: to-user.eml
    folders: [INBOX, INBOX.Away]
    spec_refs:
      - {req_id: SIEVE-28b4954e, keyword: MUST, axis: outcome, step: 1, allowed: [ok]}
    script: |
      require ["vacation", "fileinto"];
      vacation "Away.";
      fileinto "INBOX.Away";

  # ---------------- imap4flags (RFC 5232) ----------------
  flags_on_keep:
    kind: probe
    message: legal-hold.eml
    spec_refs:
      - {req_id: SIEVE-e30667ff, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    script: |
      require "imap4flags";
      addflag "\\Flagged";
      keep;

  flags_empty_string:
    kind: probe
    message: clean.eml
    spec_refs:
      - {req_id: SIEVE-ae93174b, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    script: |
      require "imap4flags";
      setflag ["", "\\Seen"];
      keep;

  # ---------------- census (12 Nov 2026): every testable ledger row not named above ----------------
  # Generated with the census authoring aid. New messages: mime-parts, broken-mime, enc-nul, received,
  # many-hops, no-subject, addr-headers. Effect axes added the same day (tiers.yaml).
  census_integer_max:
    kind: control
    message: clean.eml
    folders: ["INBOX", "INBOX.Int"]
    spec_refs:
      - {"req_id": "SIEVE-16b39b02", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Int"]]}
    script: |
      require "fileinto";
      if size :under 2147483647 { fileinto "INBOX.Int"; }

  census_quoted_multiline:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-d87354a8", "keyword": "MAY", "axis": "decision_class", "step": 1, "basis": "option"}
    script: |
      require "fileinto";
      if header :contains "Subject" "Lunch
      tomorrow" { fileinto "INBOX.Multi"; }

  census_grammar_strings:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-506446c9", "keyword": "MUST", "axis": "decision_class", "step": 1, "allowed": ["proceed"]}
    script: |
      require "fileinto";
      if header :contains "Subject" ["Lunch", "q\"uote", "back\\slash"] {
        fileinto text:
      ..dot-stuffed
      INBOX.Text
      .
      ;
      }

  census_encoded_character:
    kind: probe
    message: clean.eml
    folders: ["INBOX", "INBOX.Hex"]
    spec_refs:
      - {"req_id": "SIEVE-4aaf733a", "keyword": "SHOULD", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Hex"]]}
    script: |
      require ["fileinto", "encoded-character"];
      if header :contains "Subject" "${hex:4C 75 6E 63 68}" { fileinto "INBOX.Hex"; }

  census_encoded_character_malformed:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-8c8fc986", "keyword": "MUST", "axis": "decision_class", "step": 1, "allowed": ["proceed"]}
    script: |
      require ["fileinto", "encoded-character"];
      if header :contains "Subject" "${unicode:zz}" { fileinto "INBOX.Bad"; }

  census_encoded_nul_header:
    kind: probe
    message: enc-nul.eml
    folders: ["INBOX", "INBOX.Nul"]
    spec_refs:
      - {"req_id": "SIEVE-e025a69c", "keyword": "SHOULD", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Nul"]]}
      - {"req_id": "SIEVE-3c33e280", "keyword": "SHOULD", "axis": "intent", "step": 1, "basis": "option", "note": "how an encoded NUL is decoded is not fixed by the SHOULD"}
      - {"req_id": "SIEVE-60f38245", "keyword": "MAY", "axis": "intent", "step": 1, "basis": "option"}
      - {"req_id": "SIEVE-d2c8c805", "keyword": "MUST", "axis": "intent", "step": 1, "basis": "conditional", "note": "binds only for an engine that does not decode"}
    script: |
      require "fileinto";
      if header :contains "Subject" "needleafter" { fileinto "INBOX.Nul"; }

  census_one_keep_allowed:
    kind: control
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-a5ccc606", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["keep"]]}
      - {"req_id": "SIEVE-ad0000ee", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["keep"]]}
    script: |
      keep;

  census_parse_then_run:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-b09fe242", "keyword": "MAY", "axis": "outcome", "step": 1, "basis": "option"}
    script: |
      keep;
      if true { stop; }
      bogus_command;

  census_runtime_checks_executed:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-7c82eade", "keyword": "MUST", "axis": "outcome", "step": 1, "allowed": ["refused", "runtime-error"]}
    script: |
      redirect "not an address";

  census_checks_unreached:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-35c65e99", "keyword": "MAY", "axis": "outcome", "step": 1, "basis": "option"}
    script: |
      if false { redirect "not an address"; }
      keep;

  census_nested_tests_15:
    kind: control
    message: clean.eml
    folders: ["INBOX", "INBOX.Deep"]
    spec_refs:
      - {"req_id": "SIEVE-3d63b91b", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Deep"]]}
    script: |
      require "fileinto";
      if allof(allof(allof(allof(allof(allof(allof(allof(allof(allof(allof(allof(allof(allof(allof(true))))))))))))))) { fileinto "INBOX.Deep"; }

  census_fileinto_supported:
    kind: control
    message: phishing.eml
    folders: ["INBOX", "INBOX.Quarantine"]
    spec_refs:
      - {"req_id": "SIEVE-082bdc44", "keyword": "SHOULD", "axis": "decision_class", "step": 1, "allowed": ["proceed"]}
      - {"req_id": "SIEVE-6513f1f4", "keyword": "SHOULD", "axis": "decision_class", "step": 1, "allowed": ["proceed"]}
    script: |
      require "fileinto";
      fileinto "INBOX.Quarantine";

  census_fileinto_invalid_name:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-44b989d1", "keyword": "MAY", "axis": "outcome", "step": 1, "basis": "option"}
    script: |
      require "fileinto";
      fileinto "INBOX..bad";

  census_fileinto_non_ascii_name:
    kind: probe
    message: clean.eml
    folders: ["INBOX", "INBOX.Bücher"]
    spec_refs:
      - {"req_id": "SIEVE-4c63c070", "keyword": "SHOULD", "axis": "stored", "step": 1, "layer": "effect", "basis": "conditional", "note": "binds only for an engine whose store uses another encoding"}
    script: |
      require "fileinto";
      fileinto "INBOX.Bücher";

  census_redirect_received:
    kind: control
    message: received.eml
    spec_refs:
      - {"req_id": "SIEVE-4c32897c", "keyword": "MUST", "axis": "redirect_received_more", "step": 1, "layer": "effect", "allowed": [[true]]}
    script: |
      redirect "review@example.invalid";

  census_redirect_twice_same_message:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-1a34030c", "keyword": "MAY", "axis": "emitted", "step": 1, "layer": "effect", "basis": "option"}
      - {"req_id": "SIEVE-c26ca950", "keyword": "MAY", "axis": "emitted_headers", "step": 1, "layer": "effect", "basis": "option"}
    script: |
      redirect "a@example.invalid";
      redirect "b@example.invalid";

  census_redirect_null_sender:
    kind: probe
    message: clean.eml
    from: ""
    spec_refs:
      - {"req_id": "SIEVE-8bda45c2", "keyword": "MUST", "axis": "redirect_env_from", "step": 1, "layer": "effect", "allowed": [[], [""], null], "note": "the redirected message keeps the empty envelope sender"}
    script: |
      redirect "review@example.invalid";

  census_redirect_loop_control:
    kind: probe
    message: many-hops.eml
    spec_refs:
      - {"req_id": "SIEVE-63ceb935", "keyword": "MUST", "axis": "emitted", "step": 1, "layer": "effect", "basis": "option", "note": "a 40-hop message is within SMTP's limit; the measure taken is the engine's"}
      - {"req_id": "SIEVE-6bb244cc", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["redirect:review@example.invalid"], ["keep"], ["keep", "redirect:review@example.invalid"]]}
    script: |
      redirect "review@example.invalid";

  census_address_headers:
    kind: control
    message: addr-headers.eml
    folders: ["INBOX", "INBOX.Addr"]
    spec_refs:
      - {"req_id": "SIEVE-858c6e9d", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Addr"]]}
    script: |
      require "fileinto";
      if allof(address :domain :is "From" "example.invalid", address :domain :is "To" "example.invalid", address :domain :is "Cc" "example.invalid", address :domain :is "Bcc" "example.invalid", address :domain :is "Sender" "example.invalid", address :domain :is "Resent-From" "example.invalid", address :domain :is "Resent-To" "example.invalid") { fileinto "INBOX.Addr"; }

  census_envelope_unknown_part:
    kind: probe
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-6a0c73ea", "keyword": "SHOULD", "axis": "outcome", "step": 1, "allowed": ["refused", "runtime-error"]}
    script: |
      require "envelope";
      if envelope :is "x-pd-part" "x" { discard; }

  census_envelope_source_route:
    kind: probe
    message: clean.eml
    from: "@relay.example.invalid:attacker@example.invalid"
    folders: ["INBOX", "INBOX.Route"]
    spec_refs:
      - {"req_id": "SIEVE-24964b67", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Route"]]}
    script: |
      require ["envelope", "fileinto"];
      if envelope :is "from" "attacker@example.invalid" { fileinto "INBOX.Route"; }

  census_envelope_supported:
    kind: control
    message: clean.eml
    spec_refs:
      - {"req_id": "SIEVE-cb926c76", "keyword": "SHOULD", "axis": "decision_class", "step": 1, "allowed": ["proceed"]}
    script: |
      require "envelope";
      if envelope :is "to" "user@lab.test" { keep; }

  census_body_qp:
    kind: probe
    message: mime-parts.eml
    folders: ["INBOX", "INBOX.QP", "INBOX.B64", "INBOX.Latin", "INBOX.Seven", "INBOX.Bin", "INBOX.Split", "INBOX.Hdr", "INBOX.Whole", "INBOX.Html", "INBOX.Strip", "INBOX.Empty", "INBOX.Set"]
    spec_refs:
      - {"req_id": "SIEVE-674f7e23", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.QP"]]}
    script: |
      require ["body", "fileinto"];
      if body :content "text" :contains "needleqp" { fileinto "INBOX.QP"; }

  census_body_base64:
    kind: probe
    message: mime-parts.eml
    folders: ["INBOX", "INBOX.QP", "INBOX.B64", "INBOX.Latin", "INBOX.Seven", "INBOX.Bin", "INBOX.Split", "INBOX.Hdr", "INBOX.Whole", "INBOX.Html", "INBOX.Strip", "INBOX.Empty", "INBOX.Set"]
    spec_refs:
      - {"req_id": "SIEVE-674f7e23", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.B64"]]}
    script: |
      require ["body", "fileinto"];
      if body :content "text" :contains "needleb64" { fileinto "INBOX.B64"; }

  census_body_8bit_latin1:
    kind: probe
    message: mime-parts.eml
    folders: ["INBOX", "INBOX.QP", "INBOX.B64", "INBOX.Latin", "INBOX.Seven", "INBOX.Bin", "INBOX.Split", "INBOX.Hdr", "INBOX.Whole", "INBOX.Html", "INBOX.Strip", "INBOX.Empty", "INBOX.Set"]
    spec_refs:
      - {"req_id": "SIEVE-674f7e23", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Latin"]]}
      - {"req_id": "SIEVE-080d1fd7", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Latin"]]}
    script: |
      require ["body", "fileinto"];
      if body :content "text" :contains "naïveneedle" { fileinto "INBOX.Latin"; }

  census_body_7bit:
    kind: probe
    message: mime-parts.eml
    folders: ["INBOX", "INBOX.QP", "INBOX.B64", "INBOX.Latin", "INBOX.Seven", "INBOX.Bin", "INBOX.Split", "INBOX.Hdr", "INBOX.Whole", "INBOX.Html", "INBOX.Strip", "INBOX.Empty", "INBOX.Set"]
    spec_refs:
      - {"req_id": "SIEVE-674f7e23", "keyword": "MUST", "axis": "intent", "step": 1, "allowed": [["fileinto:INBOX.Seven"]]}
    script: |
      require ["body", "fileinto"];
      if body :content "text" :contains "split-ac" { fileinto "INBOX.Seven"; }

  census_body_binary_nul:
    kind: probe
    message: mime-parts.eml
