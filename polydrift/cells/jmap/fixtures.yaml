# JMAP fixtures (manuscript 3.1, 4.4), first batch. Each names the ledger rows it exercises (req_id,
# ledger/jmap.ledger.csv) where a keyword sentence exists; request-level error types that RFC 8620 defines without a
# keyword sentence (notJSON, notRequest, unknownCapability, unknownMethod) carry `clause` only.
# Placeholders: {acct} mail account, {U} unique name, {id:k} id of creation key k (driver.py).
cell: jmap

fixtures:

  # ---------------- controls ----------------
  echo:
    kind: control
    steps:
      - {op: call, using: ["urn:ietf:params:jmap:core"], calls: [["Core/echo", {hello: true, n: 7}, c0]]}

  session_core_capability:
    kind: control
    spec_refs:
      - {req_id: JMAP-e769d602, keyword: MUST, axis: http_status, step: 1, allowed: [200]}
      - {req_id: JMAP-3a20381e, keyword: MUST, axis: http_status, step: 1, allowed: [200]}
    steps:
      - {op: session}

  # No mailbox-count or query control: the default mailbox set is server provisioning (Stalwart 5, James 7, Cyrus 1)
  # and `total` presence differs by server (smokes 10 Nov 17:41-17:46), so both are probes below.
  # state_stable_without_change is the mail-method control.

  query_total_not_requested:
    kind: probe
    clause: "RFC 8620 5.5 total (only if requested)"
    steps:
      - {op: call, calls: [["Mailbox/query", {accountId: "{acct}", filter: {role: inbox}}, c0]]}

  # Probe split out of the control (smoke 10 Nov 17:43): with calculateTotal true, James omitted `total`.
  query_calculate_total:
    kind: probe
    clause: "RFC 8620 5.5 calculateTotal / total"
    steps:
      - {op: call, calls: [["Mailbox/query", {accountId: "{acct}", filter: {role: inbox}, calculateTotal: true}, c0]]}

  mailbox_create_get_destroy:
    kind: stateful
    spec_refs:
      - {req_id: JMAP-8b9e51f5, keyword: MUST, axis: method_names, step: 1, "order": ["Mailbox/set", "Mailbox/get"], "note": "processed in order"}
      - {req_id: JMAP-03421c3b, keyword: MUST, axis: method_names, step: 1, "order": ["Mailbox/set", "Mailbox/get"], "note": "responses in the order processed"}
    steps:
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", create: {m1: {name: "{U}a"}}}, c0],
                           ["Mailbox/get", {accountId: "{acct}", "#ids": {resultOf: c0, name: Mailbox/set, path: /created/m1/id}, properties: [name]}, c1]]}
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", destroy: ["{id:m1}"]}, c0]]}

  # ---------------- request-level errors (RFC 8620 3.6.1) ----------------
  request_not_json:
    kind: probe
    clause: "RFC 8620 3.6.1 notJSON"
    steps:
      - {op: raw, body: "{\"using\": [\"urn:ietf:params:jmap:core\"], \"methodCalls\": [", content_type: application/json}

  request_not_request:
    kind: probe
    clause: "RFC 8620 3.6.1 notRequest"
    steps:
      - {op: raw, body: "{\"methodCalls\": []}", content_type: application/json}

  request_unknown_capability:
    kind: probe
    clause: "RFC 8620 3.6.1 unknownCapability"
    steps:
      - {op: call, using: ["urn:ietf:params:jmap:core", "urn:example:pd:unknown"], calls: [["Core/echo", {}, c0]]}

  request_unknown_top_level_property:
    kind: probe
    spec_refs:
      - {req_id: JMAP-6c07d30c, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: raw, body: "{\"using\": [\"urn:ietf:params:jmap:core\"], \"methodCalls\": [[\"Core/echo\", {}, \"c0\"]], \"pdExtra\": 1}", content_type: application/json}

  request_duplicate_json_member:
    kind: probe
    spec_refs:
      - {req_id: JMAP-8db81e48, keyword: MUST, axis: decision_class, step: 1, "excludes": ["proceed"], "note": "a request that is not I-JSON is refused (RFC 8620 3.6.1 notJSON)"}
    steps:
      - {op: raw, body: "{\"using\": [\"urn:ietf:params:jmap:core\"], \"using\": [\"urn:ietf:params:jmap:core\"], \"methodCalls\": [[\"Core/echo\", {}, \"c0\"]]}", content_type: application/json}

  request_unauthenticated:
    kind: security
    tags: [authentication]
    steps:
      - {op: unauth, calls: [["Mailbox/get", {accountId: "{acct}", ids: null}, c0]]}

  # ---------------- method-level errors (3.6.2) ----------------
  method_unknown:
    kind: probe
    clause: "RFC 8620 3.6.2 unknownMethod"
    steps:
      - {op: call, calls: [["Mailbox/pdNoSuchMethod", {accountId: "{acct}"}, c0], ["Core/echo", {after: 1}, c1]]}

  method_invalid_arguments:
    kind: probe
    spec_refs:
      - {req_id: JMAP-45bd69f1, keyword: MUST, axis: method_errors, step: 1, allowed: [[invalidArguments]]}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: "not-a-list"}, c0]]}

  method_invalid_property:
    kind: probe
    spec_refs:
      - {req_id: JMAP-4ad1dd7b, keyword: MUST, axis: method_errors, step: 1, allowed: [[invalidArguments]]}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: null, properties: [name, pdNoSuchProperty]}, c0]]}

  method_unknown_account:
    kind: probe
    clause: "RFC 8620 3.6.2 accountNotFound"
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "pd-no-such-account", ids: null}, c0]]}

  result_reference_unresolved:
    kind: probe
    spec_refs:
      - {req_id: JMAP-ceb10383, keyword: MUST, axis: method_errors, step: 1, allowed: [[null, invalidResultReference]]}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: [], properties: [name]}, c0],
                           ["Mailbox/get", {accountId: "{acct}", "#ids": {resultOf: c9, name: Mailbox/get, path: /list/*/id}}, c1]]}

  argument_normal_and_referenced:
    kind: probe
    spec_refs:
      - {req_id: JMAP-6067f627, keyword: MUST, axis: method_errors, step: 1, allowed: [[null, invalidArguments]]}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: [], properties: [name]}, c0],
                           ["Mailbox/get", {accountId: "{acct}", ids: [], "#ids": {resultOf: c0, name: Mailbox/get, path: /list/*/id}}, c1]]}

  # ---------------- /get, /set, /changes semantics (5.1 to 5.3) ----------------
  get_duplicate_ids:
    kind: probe
    spec_refs:
      - {req_id: JMAP-09c1ce0a, keyword: MUST, axis: get_shape, step: 1, allowed: [[[0, 1]]]}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: [pdNoSuchId, pdNoSuchId]}, c0]]}

  set_destroy_not_found:
    kind: probe
    spec_refs:
      - {req_id: JMAP-8657ff73, keyword: MUST, axis: set_outcome, step: 1, "allowed": [[[["created", []], ["destroyed", 0], ["notCreated", []], ["notDestroyed", ["notFound"]], ["notUpdated", []], ["updated", 0]]]], "note": "rejected with a notFound SetError"}
    steps:
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", destroy: [pdNoSuchId]}, c0]]}

  set_update_not_found:
    kind: probe
    spec_refs:
      - {req_id: JMAP-8657ff73, keyword: MUST, axis: set_outcome, step: 1, "allowed": [[[["created", []], ["destroyed", 0], ["notCreated", []], ["notDestroyed", []], ["notUpdated", ["notFound"]], ["updated", 0]]]], "note": "rejected with a notFound SetError"}
    steps:
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", update: {pdNoSuchId: {name: x}}}, c0]]}

  mailbox_sibling_same_name:
    kind: probe
    spec_refs:
      - {req_id: JMAP-0ee2aaa8, keyword: MUST, axis: set_outcome, step: 1, "excludes": [[["created", ["m1", "m2"]], ["destroyed", 0], ["notCreated", []], ["notDestroyed", []], ["notUpdated", []], ["updated", 0]]], "note": "the second sibling with the same name is refused"}
    steps:
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", create: {m1: {name: "{U}dup"}, m2: {name: "{U}dup"}}}, c0]]}

  mailbox_second_role:
    kind: probe
    spec_refs:
      - {req_id: JMAP-dfdde9dd, keyword: MUST, axis: set_outcome, step: 1, "excludes": [[["created", ["m1"]], ["destroyed", 0], ["notCreated", []], ["notDestroyed", []], ["notUpdated", []], ["updated", 0]]], "note": "a second Mailbox with role inbox is refused"}
    steps:
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", create: {m1: {name: "{U}inbox2", role: inbox}}}, c0]]}

  mailbox_sort_order_range:
    kind: probe
    spec_refs:
      - {req_id: JMAP-20baa166, keyword: MUST, axis: set_outcome, step: 1, "excludes": [[["created", ["m1"]], ["destroyed", 0], ["notCreated", []], ["notDestroyed", []], ["notUpdated", []], ["updated", 0]]], "note": "sortOrder 2^31 is outside the range and refused"}
    steps:
      - {op: call, calls: [["Mailbox/set", {accountId: "{acct}", create: {m1: {name: "{U}so", sortOrder: 2147483648}}}, c0]]}

  changes_bad_state:
    kind: probe
    spec_refs:
      - {req_id: JMAP-73799634, keyword: MUST, axis: method_errors, step: 1, allowed: [[cannotCalculateChanges]]}
    steps:
      - {op: call, calls: [["Mailbox/changes", {accountId: "{acct}", sinceState: "pd-not-a-state"}, c0]]}

  changes_max_changes_zero:
    kind: probe
    spec_refs:
      - {req_id: JMAP-d12dbb59, keyword: MUST, axis: method_errors, step: 2, allowed: [[invalidArguments]]}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: []}, c0]]}
      - {op: call, calls: [["Mailbox/changes", {accountId: "{acct}", sinceState: "pd-not-a-state", maxChanges: 0}, c0]]}

  state_stable_without_change:
    kind: control
    spec_refs:
      - {req_id: JMAP-3024085c, keyword: SHOULD, axis: state_present, step: 1, "basis": "not-observable", "note": "the state value is not compared on this axis"}
    steps:
      - {op: call, calls: [["Mailbox/get", {accountId: "{acct}", ids: []}, c0], ["Mailbox/get", {accountId: "{acct}", ids: []}, c1]]}

  email_query_negative_position:
    kind: probe
    spec_refs:
      - {req_id: JMAP-849289e9, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: call, calls: [["Email/query", {accountId: "{acct}", position: -5, calculateTotal: true}, c0]]}

  # ---------------- census (12 Nov 2026): every testable ledger row not named above ----------------
  # Generated with the census authoring aid. Fixture-specific observations use the generic axes x1..x8
  # through each step's `extract` expressions (driver.py); new ops upload, download, eventsource.
  census_session_core_limits:
    kind: control
    spec_refs:
      - {"req_id": "JMAP-7644f7a6", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-fae0bdc2", "keyword": "SHOULD", "axis": "x2", "step": 1, "allowed": [false]}
      - {"req_id": "JMAP-c8ae89ce", "keyword": "MUST", "axis": "x3", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-10296288", "keyword": "MUST", "axis": "x3", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-433daa12", "keyword": "SHOULD", "axis": "x4", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-5b8c263d", "keyword": "MUST", "axis": "x5", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-24b24c13", "keyword": "MUST", "axis": "x5", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-08a9f4b2", "keyword": "MUST", "axis": "x6", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-b405886e", "keyword": "MUST", "axis": "x6", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-714ab938", "keyword": "MUST", "axis": "x7", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-316df093", "keyword": "MAY", "axis": "x8", "step": 1, "basis": "option"}
      - {"req_id": "JMAP-0d6267e3", "keyword": "MAY", "axis": "x8", "step": 1, "basis": "option"}
    steps:
      - {"op": "session", "extract": {"x1": "hasall:body/capabilities/urn:ietf:params:jmap:core=[\"maxSizeUpload\", \"maxConcurrentUpload\", \"maxSizeRequest\", \"maxConcurrentRequests\", \"maxCallsInRequest\", \"maxObjectsInGet\", \"maxObjectsInSet\", \"collationAlgorithms\"]", "x2": "has:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:core", "x3": "re:body/downloadUrl=(?=.*\\{accountId\\})(?=.*\\{blobId\\})(?=.*\\{type\\})(?=.*\\{name\\}).*", "x4": "re:body/downloadUrl=.*\\?.*type.*", "x5": "re:body/uploadUrl=.*\\{accountId\\}.*", "x6": "re:body/eventSourceUrl=(?=.*\\{types\\})(?=.*\\{closeafter\\})(?=.*\\{ping\\}).*", "x7": "has:body/eventSourceUrl", "x8": "keys:body"}}

  census_session_mail_capability:
    kind: control
    spec_refs:
      - {"req_id": "JMAP-fe8a294a", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-0dbafb6e", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-461ce6f4", "keyword": "MUST", "axis": "x2", "step": 1, "basis": "conditional", "note": "binds only for capabilities the user cannot use"}
      - {"req_id": "JMAP-0a908289", "keyword": "MUST", "axis": "x3", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-2457628a", "keyword": "MUST", "axis": "x4", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-5f1d8b46", "keyword": "MUST", "axis": "x5", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-300e892c", "keyword": "MAY", "axis": "x6", "step": 1, "basis": "option"}
      - {"req_id": "JMAP-2a352e96", "keyword": "MAY", "axis": "x2", "step": 1, "basis": "option"}
      - {"req_id": "JMAP-c944e6b4", "keyword": "MUST", "axis": "x7", "step": 1, "allowed": [true, "null"]}
      - {"req_id": "JMAP-4f8566c6", "keyword": "MAY", "axis": "x8", "step": 1, "basis": "option"}
      - {"req_id": "JMAP-6dc58936", "keyword": "MAY", "axis": "x2", "step": 1, "basis": "option"}
      - {"req_id": "JMAP-5b9d74a9", "keyword": "MUST", "axis": "x2", "step": 1, "basis": "not-observable", "note": "capability keys do not show property support"}
    steps:
      - {"op": "session", "extract": {"x1": "has:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:mail", "x2": "keys:body/accounts/{acct}/accountCapabilities", "x3": "hasall:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:mail=[\"maxMailboxesPerEmail\", \"maxMailboxDepth\", \"maxSizeMailboxName\", \"maxSizeAttachmentsPerEmail\", \"emailQuerySortOptions\", \"mayCreateTopLevelMailbox\"]", "x4": "nullorge:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:mail/maxMailboxesPerEmail=1", "x5": "ge:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:mail/maxSizeMailboxName=100", "x6": "body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:mail/maxSizeAttachmentsPerEmail", "x7": "hasall:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:submission=[\"maxDelayedSend\", \"submissionExtensions\"]", "x8": "nodate:body/accounts/{acct}/accountCapabilities/urn:ietf:params:jmap:submission/submissionExtensions"}}

  census_unauthenticated:
    kind: probe
    spec_refs:
      - {"req_id": "JMAP-0e0895ce", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [401, 403]}
    steps:
      - {"op": "unauth", "calls": [["Core/echo", {"a": 1}, "c0"]], "extract": {"x1": "http"}}

  census_response_json:
    kind: control
    spec_refs:
      - {"req_id": "JMAP-a54684f5", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": ["application/json"]}
      - {"req_id": "JMAP-3883a039", "keyword": "MUST", "axis": "x2", "step": 1, "allowed": ["object"]}
    steps:
      - {"op": "call", "calls": [["Core/echo", {"a": 1}, "c0"]], "extract": {"x1": "ctype", "x2": "type:body"}}

  census_opt_in_only:
    kind: probe
    spec_refs:
      - {"req_id": "JMAP-8a368cf0", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true]}
    steps:
      - {"op": "call", "calls": [["Mailbox/get", {"accountId": "{acct}", "ids": []}, "c0"]], "using": ["urn:ietf:params:jmap:core"], "extract": {"x1": "eq:r0/type=unknownMethod"}}

  census_method_error_sequence:
    kind: probe
    spec_refs:
      - {"req_id": "JMAP-3b95614b", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [["Core/echo", "error", "Core/echo"]]}
      - {"req_id": "JMAP-81de09b5", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [["Core/echo", "error", "Core/echo"]]}
      - {"req_id": "JMAP-58c49786", "keyword": "MUST", "axis": "x2", "step": 1, "allowed": [200]}
      - {"req_id": "JMAP-32c876e5", "keyword": "MUST", "axis": "x3", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-d6777436", "keyword": "MAY", "axis": "x4", "step": 1, "basis": "option"}
    steps:
      - {"op": "call", "calls": [["Core/echo", {"a": 1}, "c0"], ["Pd/noSuchMethod", {}, "c1"], ["Core/echo", {"b": 2}, "c2"]], "extract": {"x1": "m0", "x2": "http", "x3": "has:r1/type", "x4": "has:r1/description"}}

  census_method_error_no_change:
    kind: stateful
    spec_refs:
      - {"req_id": "JMAP-6e6f0c1f", "keyword": "MUST", "axis": "x1", "step": 3, "allowed": [true]}
    steps:
      - {"op": "call", "calls": [["Mailbox/get", {"accountId": "{acct}", "ids": []}, "c0"]], "key": "s1"}
      - {"op": "call", "calls": [["Mailbox/set", {"accountId": "{acct}", "create": {"k": {"name": "pd{U}x"}}, "ifInState": "pd-not-a-state"}, "c0"]]}
      - {"op": "call", "calls": [["Mailbox/get", {"accountId": "{acct}", "ids": []}, "c0"]], "extract": {"x1": "eq:r0/state={state:s1}"}}

  census_result_reference:
    kind: control
    spec_refs:
      - {"req_id": "JMAP-57318545", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": ["Mailbox/get"]}
      - {"req_id": "JMAP-57318545", "keyword": "MUST", "axis": "x2", "step": 1, "allowed": [false]}
    steps:
      - {"op": "call", "calls": [["Mailbox/query", {"accountId": "{acct}"}, "q"], ["Mailbox/get", {"accountId": "{acct}", "#ids": {"resultOf": "q", "name": "Mailbox/query", "path": "/ids"}, "properties": ["name"]}, "g"]], "extract": {"x1": "m1", "x2": "eq:m1=error"}}

  census_created_ids:
    kind: probe
    spec_refs:
      - {"req_id": "JMAP-7724a394", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true, "null"]}
    steps:
      - {"op": "call", "calls": [["Mailbox/set", {"accountId": "{acct}", "create": {"ci": {"name": "pd{U}ci"}}}, "mc"]], "createdIds": {"pdprior": "pd-prior-id"}, "extract": {"x1": "hasall:body/createdIds=[\"pdprior\", \"ci\"]"}}

  census_default_arguments:
    kind: control
    spec_refs:
      - {"req_id": "JMAP-d85d18da", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-7e40c109", "keyword": "MAY", "axis": "x2", "step": 1, "basis": "option"}
    steps:
      - {"op": "call", "calls": [["Mailbox/get", {"accountId": "{acct}"}, "c0"]], "extract": {"x1": "has:r0/list/0/name", "x2": "keys:r0"}}

  census_problem_details:
    kind: probe
    spec_refs:
      - {"req_id": "JMAP-c3627067", "keyword": "SHOULD", "axis": "x1", "step": 1, "allowed": ["application/problem+json"]}
    steps:
      - {"op": "raw", "body": "{not json", "extract": {"x1": "ctype"}}

  census_limit_problem:
    kind: probe
    spec_refs:
      - {"req_id": "JMAP-12c13f8c", "keyword": "MUST", "axis": "x1", "step": 1, "allowed": [true]}
      - {"req_id": "JMAP-12c13f8c", "keyword": "MUST", "axis": "x2", "step": 1, "allowed": [true]}
    steps:
