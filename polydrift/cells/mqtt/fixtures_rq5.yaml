# RQ5 known-bug fixtures, MQTT cell (manuscript 4.4 and 4.6); see dns/fixtures_rq5.yaml for the rule.
fixtures:
  # M1, nanomq issue #1782 (16 Jun 2024, NanoMQ 0.21.8; CVE-2024-42655): `mosquitto_sub -t "+/brokers/+"` received
  # $SYS data, against MQTT-4.7.2-1. Another client then connects, publishes to 1/1/1 and disconnects, which is what
  # makes a broker publish its $SYS client events.
  rq5_m1_sys_via_wildcard:
    kind: probe
    tags: ["security:topic-isolation"]
    spec_refs:
      - {"native": "MQTT-4.7.2-1", "keyword": "MUST", "axis": "dollar_topics", "step": 3, "allowed": [[]]}
      - {"native": "MQTT-4.7.2-1", "keyword": "MUST", "axis": "dollar_topics", "step": 4, "allowed": [[]]}
      - {"native": "MQTT-4.7.2-1", "keyword": "MUST", "axis": "dollar_topics", "step": 5, "allowed": [[]]}
    steps:
      - {"client": "b", "op": "connect", "args": {"client_id": "{C}b"}, "window_ms": 500}
      - {"client": "b", "op": "subscribe", "args": {"packet_id": 1, "filters": [{"topic": "+/brokers/+"}]}, "window_ms": 1500}
      - {"client": "a", "op": "connect", "args": {"client_id": "{C}a"}, "window_ms": 3000}
      - {"client": "a", "op": "publish", "args": {"topic": "1/1/1", "payload": "123", "qos": 0}, "window_ms": 3000}
      - {"client": "a", "op": "disconnect", "window_ms": 3000}

  # BEGIN generated: mbfuzzer (tools/gen_rq5_mbfuzzer.py)
  # MBFuzzer N1: MQTT 3.1.1 SUBSCRIBE with Packet Identifier 0. Affected per Table 10: emqx 5.6.0, nanomq 0.21.10, vernemq 1.13.0, hivemq-ce 2024.1.
  rq5_mb_n1:
    kind: probe
    clause: "MQTT-2.3.1-1 (MUST); judged at step 2"
    steps:
      - {"client": "a", "op": "connect", "args": {"client_id": "{C}a", "version": 4}}
      - {"client": "a", "op": "hex", "hex": "82 06 0000 0001 78 00", "expect_reply": true}

  # MBFuzzer N3: MQTT 3.1.1 CONNECT with User Name Flag 1 and no user name. Affected per Table 10: emqx 5.6.0, mosquitto 2.0.18, vernemq 1.13.0, hivemq-ce 2024.1.
  rq5_mb_n3:
    kind: probe
    clause: "MQTT-3.1.2-19 (MUST); judged at step 1"
    steps:
      - {"client": "a", "op": "hex", "hex": "10 0e 0004 4d515454 04 82 003c 0002 7064", "expect_reply": true}

