# DNS cell: axis -> tier (manuscript 3.3). Consumer: the stub resolver and the
# application behind it.
# Status: DRAFT, not deposited. First use: re-expressing the StackDiff
# role-consistency oracle against core/. The peer-resolver fixtures add axes
# when the cell is built.
cell: dns
profile: dns-default-v1
refusal_class: null
axes:
  decision_class:
    tier: 1
    kappa: identity
    clause: "T1: the stub's next action follows the class (classes.py)"
  response_type:
    tier: 2
    kappa: identity
    clause: "T2: NXDOMAIN denies the name, NODATA one type; the stub caches different negative answers (RFC 2308)"
  answers:
    tier: 2
    kappa: rrset
    clause: "T2: the answer RRset is the data the application receives; RRsets are unordered (RFC 2181 5)"
  native_code:
    tier: 3
    kappa: identity
    clause: "T3: the RCODE within its class"
  aa:
    tier: 3
    kappa: identity
    clause: "T3: a stub acts the same on an answer whatever its AA flag"
  ra:
    tier: 3
    kappa: identity
    clause: "T3: RA does not change what a stub does with an answer it received"
  additional:
    tier: 3
    kappa: additional
    clause: "T3 for the stub; glue acceptance is observed as cache content (end state)"
  tc:
    tier: 2
    kappa: identity
    clause: "T2: a truncated reply makes the stub repeat the query over TCP (RFC 2181 9); the class records it as no-decision"
  ad:
    tier: 3
    kappa: identity
    clause: "T3: on unsigned lab zones the stub has nothing to act on; AD set without validation is a probe finding"
  authority_soa:
    tier: 3
    kappa: identity
    clause: "T3: the SOA in a negative answer sets how long a downstream cache keeps it (RFC 2308 5); the stub itself does not act on it"
  edns:
    tier: 3
    kappa: identity
    clause: "T3: OPT present in the reply; an EDNS client may fall back without it (RFC 6891 7)"
  glue_cache_accept:
    tier: 2
    kappa: identity
    end_state: true
    clause: "T2: what the resolver will serve later from its cache (end-state probe, security)"
volatile: []
