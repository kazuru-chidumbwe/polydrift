      - {"op": "send", "from": "alice", "window_ms": 400, "msg": "MESSAGE sip:bob@{domain} SIP/2.0\nVia: SIP/2.0/UDP {lab}:{port:alice};branch={branch};rport\nMax-Forwards: 70\nFrom: <sip:alice@{domain}>;tag={tag:alice}\nTo: <sip:bob@{domain}>\nCall-ID: {callid}\nCSeq: 2 MESSAGE\nContact: <sip:alice@{lab}:{port:alice}>\nContent-Type: text/plain\nContent-Length: {clen}\n\n", "extract": {"x4": "has:bob/0/hdr/record-route"}}
