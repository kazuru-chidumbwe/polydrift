# Knot Resolver 6, lab deviations only: listen on the lab net, DNSSEC off, root hints (6.x has no YAML key for root
# hints, so the documented lua passthrough sets them as in 5.x).
workers: 1
network:
  listen:
    - interface: 0.0.0.0@53
dnssec:
  enable: false
lua:
  script: |
    modules.load('hints > iterate')
    hints.root({ ['a.root.pdlab.'] = '172.31.53.10' })
