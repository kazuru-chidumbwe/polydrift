# Unbound as a forwarder (forwarding-role cell): everything to the lab recursive upstream at .54, no fallback.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-ip6: no
  module-config: "iterator"
  chroot: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
  do-not-query-localhost: no
forward-zone:
  name: "."
  forward-addr: 172.31.53.54
