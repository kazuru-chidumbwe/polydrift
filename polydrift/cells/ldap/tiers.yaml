# LDAP cell: axis -> tier (manuscript 3.3). Consumer: the LDAP client library and the application behind it.
# Status: DRAFT, not frozen.
cell: ldap
profile: ldap-default-v1
refusal_class: null   # a server's refusal is a resultCode (protocolError) or closing the session, both observed
axes:
  decision_class:
    tier: 1
    kappa: identity
    clause: "T1: the client's next action follows the result class (classes.py)"
  response_ops:
    tier: 2
    kappa: search_runs_sorted
    clause: "T2: which response messages the client receives, in order, decides what the library returns; entries and continuation references within one result set may come in any order (RFC 4511 4.5.2), so their interleaving is canonicalised"
  entries:
    tier: 2
    kappa: dn_set
    clause: "T2: the entries a search returns (DNs, case-insensitive, base DN removed) are the data the application gets"
  entry_attrs:
    tier: 2
    kappa: attr_map
    clause: "T2: attribute types returned per entry (names case-folded); values compared for the attributes a fixture names"
  notice_of_disconnection:
    tier: 2
    kappa: identity
    clause: "T2: an unsolicited Notice of Disconnection ends the session (RFC 4511 4.4.1)"
  attr_names:
    tier: 3
    kappa: dn_set
    clause: "T3: attribute descriptions the server used for returned attributes (short name vs OID, RFC 4511 4.5.2)"
  objectclasses:
    tier: 2
    kappa: dn_set
    clause: "T2: objectClass values of the returned entries; an application decides an entry's kind from them (RFC 4512 3.3)"
  subschema_rdn_attr:
    tier: 2
    kappa: dn_set
    clause: "T2: naming attribute of the subschema subentry a client must locate to read the schema (RFC 4512 3.2, 4.2)"
  referral_shape:
    tier: 2
    kappa: identity
    clause: "T2: a referral without a URI leaves the client nowhere to go (RFC 4511 4.1.10)"
  referral_uris:
    tier: 2
    kappa: dn_set
    clause: "T2: the URIs a client follows (RFC 4511 4.1.10, 4.5.3)"
  sasl_creds_present:
    tier: 3
    kappa: identity
    clause: "T3: serverSaslCreds present in BindResponse (RFC 4511 4.2.2)"
  native_codes:
    tier: 3
    kappa: identity
    clause: "T3: resultCode within its decision class"
  diagnostic_present:
    tier: 4
    kappa: identity
    clause: "T4: diagnosticMessage is for humans (4.1.9); compared as present/absent"
