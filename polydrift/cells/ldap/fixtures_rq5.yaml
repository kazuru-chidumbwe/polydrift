# RQ5 known-bug fixtures, LDAP cell (manuscript 4.4 and 4.6); see dns/fixtures_rq5.yaml for the rule.
fixtures:
  # L2, lldap issue #974: a simple bind with an empty DN (the client set no credentials) was answered
  # namingViolation (64) "Missing DN value"; PR #977 (lldap 0.6.0) answers inappropriateAuthentication (48).
  rq5_l2_bind_empty_dn:
    kind: security
    tags: [authentication]
    clause: "RFC 4513 5.1.1 and 5.1.2; RFC 4511 4.2.2"
    steps:
      - {op: bind, args: {dn: "", password: ""}}

  # L1, 389-ds #3586 (Pagure 50530): a search listing "1.1" together with other attributes returned no attributes;
  # "1.1" means no attributes only when it is the only one listed (RFC 4511 4.5.1.8). Fix b543627, first tagged in
  # 389-ds-base 1.4.0.27.
  rq5_l1_attrs_with_1_1:
    kind: probe
    clause: "RFC 4511 4.5.1.8"
    steps:
      - {op: bind, args: {dn: "{A}", password: "{P}"}}
      - {op: search, args: {base: "{B}", scope: base, attributes: ["1.1", "dc"]}}
