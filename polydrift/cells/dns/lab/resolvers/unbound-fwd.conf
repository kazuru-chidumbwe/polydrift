# Unbound as a forwarder (RQ5 D1 recall runs): unbound.conf plus a forward zone for pd.pdlab. pointing at the lab
# authority, so the authority's query log shows what the forwarder sends for a client's RD=0 query.
# allow_snoop admits RD=0 queries (plain allow answers them REFUSED before any forwarding, which hides the D1
# behaviour on every version); the Unbound 1.18.0 fix refuses to send RD=0 queries to a forwarder.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow_snoop
  do-ip6: no
  root-hints: "/conf/root.hints"
  module-config: "iterator"
  chroot: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
forward-zone:
  name: "pd.pdlab."
  forward-addr: 172.31.53.12
