# Unbound as a forwarder (RQ5 D1 recall runs): unbound.conf plus a forward zone for pd.pdlab. pointing at the lab
# authority, so the authority's query log shows what the forwarder sends for a client's RD=0 query.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-ip6: no
  root-hints: "/conf/root.hints"
  module-config: "iterator"
  chroot: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
forward-zone:
  name: "pd.pdlab."
  forward-addr: 172.31.53.12
