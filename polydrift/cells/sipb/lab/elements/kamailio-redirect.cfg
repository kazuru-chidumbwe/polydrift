#!KAMAILIO
# polydrift sipb: Kamailio as a REDIRECT server (302 with the registered contacts) and registrar for lab.test (RFC 3261 roles), the distribution's
# default behaviour kept wherever the role allows: in-memory location table, Record-Route on dialog-forming requests,
# loose routing, Max-Forwards default 70, the sanity module's default checks. Lab-only: no authentication, no NAT.

debug=2
log_stderror=yes
fork=yes
children=2
tcp_children=2
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
alias="lab.test"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "method_filtering", 1)
modparam("rr", "append_fromtag", 1)

request_route {
	route(REQINIT);
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}
	route(WITHINDLG);
	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE|REFER")) {
		record_route();
	}
	if (is_method("REGISTER") && uri==myself) {
		if (!save("location")) {
			sl_reply_error();
		}
		exit;
	}
	if (is_method("OPTIONS") && uri==myself && $rU==$null) {
		sl_send_reply("200", "OK");
		exit;
	}
	if ($rU==$null) {
		sl_send_reply("484", "Address Incomplete");
		exit;
	}
	if (uri==myself && !is_method("ACK|CANCEL")) {
		if (lookup("location")) {
			# redirect server (RFC 3261 8.3): every registered contact goes back in a 302
			append_to_reply("Contact: <$ru>\r\n");
			if ($(branch(uri)[0]) != $null) {
				append_to_reply("Contact: <$(branch(uri)[0])>\r\n");
			}
			sl_send_reply("302", "Moved Temporarily");
			exit;
		}
		if (1) {
			$var(rc) = $rc;
			t_newtran();
			switch ($var(rc)) {
				case -1:
				case -3:
					send_reply("404", "Not Found");
					exit;
				case -2:
					send_reply("405", "Method Not Allowed");
					exit;
			}
		}
	}
	route(RELAY);
}

route[RELAY] {
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

route[REQINIT] {
	if (!mf_process_maxfwd_header("70")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check()) {
		exit;
	}
}

route[WITHINDLG] {
	if (!has_totag()) {
		return;
	}
	if (loose_route()) {
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			route(RELAY);
			exit;
		}
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}
