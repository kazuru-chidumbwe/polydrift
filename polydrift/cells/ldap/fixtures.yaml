# LDAP fixtures (manuscript 3.1, 4.4), phase 1: protocol fixtures that need no write access. Each names the ledger
# rows it exercises (req_id, ledger/ldap.ledger.csv), the axis, the step and the values the clause allows.
# Placeholders: {B} base DN, {A} admin DN, {P} admin password, {U} unique name (driver.py).
# Status: first batch (10 Nov 2026). Phase 2 (add, modify, delete, modify DN, schema rules) follows.
cell: ldap

fixtures:

  # ---------------- controls ----------------
  bind_anonymous:
    kind: control
    spec_refs:
      - {req_id: LDAP-bbb04d54, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: bind, args: {dn: "", password: ""}}

  bind_admin:
    kind: control
    steps:
      - {op: bind, args: {dn: "{A}", password: "{P}"}}

  rootdse_read:
    kind: control
    spec_refs:
      - {req_id: LDAP-b47fa8b8, keyword: MUST, axis: entries, step: 2, allowed: [["{B}"]], note: "root DSE has the empty DN"}
    steps:
      - {op: bind, args: {dn: "", password: ""}}
      - {op: search, args: {base: "", scope: base, filter: [present, objectClass], attributes: [supportedLDAPVersion]}}

  search_before_bind:
    kind: control
    spec_refs:
      - {req_id: LDAP-652b8b73, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
      - {req_id: LDAP-7eaf7f98, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: search, args: {base: "", scope: base, filter: [present, objectClass], attributes: [supportedLDAPVersion]}}

  unbind_ends_session:
    kind: control
    steps:
      - {op: bind, args: {dn: "", password: ""}}
      - {op: unbind, window_ms: 800}

  # ---------------- bind ----------------
  bind_version_2:
    kind: probe
    spec_refs:
      - {req_id: LDAP-204c5f23, keyword: MUST, axis: native_codes, step: 1, allowed: [[2]]}
    steps:
      - {op: bind, args: {version: 2, dn: "", password: ""}}

  bind_version_4:
    kind: probe
    spec_refs:
      - {req_id: LDAP-204c5f23, keyword: MUST, axis: native_codes, step: 1, allowed: [[2]]}
    steps:
      - {op: bind, args: {version: 4, dn: "", password: ""}}

  bind_sasl_empty_mechanism:
    kind: probe
    spec_refs:
      - {req_id: LDAP-888e985f, keyword: MUST, axis: native_codes, step: 1, allowed: [[7]]}
    steps:
      - {op: bind, args: {dn: "", sasl: {mechanism: ""}}}

  bind_wrong_password:
    kind: security
    tags: [authentication]
    spec_refs:
      - {req_id: LDAP-521b9618, keyword: MUST, axis: native_codes, step: 1, allowed: [[49]], security: false}
      - {req_id: LDAP-521b9618, keyword: MUST, axis: native_codes, step: 1, excludes: [0], note: "security property: the bind is not granted"}
    steps:
      - {op: bind, args: {dn: "{A}", password: "pd-not-the-password"}}

  bind_unauthenticated:
    kind: security
    tags: [authentication]
    spec_refs:
      - {req_id: LDAP-885ca99e, keyword: SHOULD, axis: native_codes, step: 1, allowed: [[53]], security: false}
      - {req_id: LDAP-885ca99e, keyword: SHOULD, axis: native_codes, step: 1, excludes: [0], note: "security property: the unauthenticated bind does not authenticate"}
    steps:
      - {op: bind, args: {dn: "{A}", password: ""}}

  bind_trailing_component:
    kind: probe
    spec_refs:
      - {req_id: LDAP-f75c2053, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: hex, hex: "30 11 02 01 01 60 0c 02 01 03 04 00 80 00 04 03 61 62 63", expect_reply: true}

  # ---------------- controls (RFC 4511 4.1.11) ----------------
  control_unknown_critical:
    kind: probe
    spec_refs:
      - {req_id: LDAP-f9246cdf, keyword: MUST, axis: native_codes, step: 1, allowed: [[12]]}
    steps:
      - {op: search, args: {base: "", scope: base}, controls: [{oid: 1.3.6.1.4.1.99999.7.1, critical: true}]}

  control_unknown_noncritical:
    kind: probe
    spec_refs:
      - {req_id: LDAP-8b68c174, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: search, args: {base: "", scope: base}, controls: [{oid: 1.3.6.1.4.1.99999.7.1}]}

  control_value_zero_bytes:
    kind: probe
    spec_refs:
      - {req_id: LDAP-80b8521f, keyword: MUST, axis: decision_class, step: 1, allowed: [proceed]}
    steps:
      - {op: search, args: {base: "", scope: base}, controls: [{oid: 1.3.6.1.4.1.99999.7.2, value: "00ff0000", hex: true}]}

  # ---------------- abandon, extended ----------------
  abandon_unknown_id:
    kind: probe
    spec_refs:
      - {req_id: LDAP-333eae07, keyword: MUST, axis: response_ops, step: 1, allowed: [[]]}
    steps:
      - {op: abandon, args: {id: 999}}
      - {op: search, args: {base: "", scope: base}}

  extended_unknown_oid:
    kind: probe
    spec_refs:
      - {req_id: LDAP-f8531903, keyword: MUST, axis: native_codes, step: 1, allowed: [[2]]}
    steps:
      - {op: extended, args: {oid: 1.3.6.1.4.1.99999.9.9, value: "\u0000\u0001\u0000"}}

  # ---------------- malformed PDUs (RFC 4511 4.1.1, 5.1, 6) ----------------
  pdu_set_instead_of_sequence:
    kind: probe
    spec_refs:
      - {req_id: LDAP-e6a29a58, keyword: MUST, axis: status, step: 1, allowed: [closed, notice]}
    steps:
      - {op: hex, hex: "31 0c 02 01 01 60 07 02 01 03 04 00 80 00", expect_reply: true}

  pdu_unknown_operation:
    kind: probe
    spec_refs:
      - {req_id: LDAP-06500410, keyword: MUST, axis: native_codes, step: 1, allowed: [[2]]}
      - {req_id: LDAP-4db0f908, keyword: SHOULD, axis: status, step: 1, allowed: [closed]}
    steps:
      - {op: hex, hex: "30 07 02 01 01 7a 02 04 00", expect_reply: true}

  pdu_indefinite_length:
    kind: probe
    spec_refs:
      - {req_id: LDAP-01a99b4b, keyword: MUST, axis: status, step: 1, allowed: [closed]}
      - {req_id: LDAP-986dc844, keyword: MUST, axis: status, step: 1, allowed: [closed, responded]}
    steps:
      - {op: hex, hex: "30 80 02 01 01 60 07 02 01 03 04 00 80 00 00 00", expect_reply: true}

  # ---------------- search semantics (RFC 4511 4.5) ----------------
  filter_unknown_attribute:
    kind: probe
    spec_refs:
      - {req_id: LDAP-2840ebef, keyword: MUST, axis: decision_class, step: 2, allowed: [proceed]}
      - {req_id: LDAP-2840ebef, keyword: MUST, axis: decision_class, step: 3, allowed: [proceed]}
    steps:
      - {op: bind, args: {dn: "{A}", password: "{P}"}}
      - {op: search, args: {base: "", scope: base, filter: [eq, pdNoSuchAttribute, x]}}
      - {op: search, args: {base: "{B}", scope: sub, filter: [eq, pdNoSuchAttribute, x]}}

  filter_not_undefined:
    kind: probe
    spec_refs:
      - {req_id: LDAP-f12b819b, keyword: MUST, axis: entries, step: 1, allowed: [[]]}
    steps:
      - {op: search, args: {base: "", scope: base, filter: [not, [eq, pdNoSuchAttribute, x]]}}

  filter_extensible_no_rule:
    kind: probe
    spec_refs:
      - {req_id: LDAP-c3c37d12, keyword: MUST, axis: entries, step: 1, allowed: [["{B}"]]}
    steps:
      - {op: search, args: {base: "", scope: base, filter: [ext, "", objectClass, top, false]}}

  attribute_unknown_option:
    kind: probe
    spec_refs:
      - {req_id: LDAP-b443bc7f, keyword: MUST, axis: entry_attrs, step: 1, "basis": "option", "note": "the clause makes the option unrecognized; whether a list of only unrecognized names then returns no attributes or all user attributes (RFC 4511 4.5.1.8) is not fixed"}
    steps:
      - {op: search, args: {base: "", scope: base, attributes: ["objectClass;x-pd-unknown"]}}

  base_not_found_no_reference:
    kind: probe
    spec_refs:
      - {req_id: LDAP-f91a778c, keyword: MUST, axis: response_ops, step: 1, allowed: [[SearchResultDone]]}
    steps:
      - {op: search, args: {base: "cn={U},{B}", scope: sub}}

  rootdse_sasl_mechanisms_anonymous:
    kind: probe
    spec_refs:
      - {req_id: LDAP-67c76af7, keyword: SHOULD, axis: entry_attrs, step: 2, "basis": "conditional", "note": "binds only for a server that offers SASL mechanisms"}
    steps:
      - {op: bind, args: {dn: "", password: ""}}
      - {op: search, args: {base: "", scope: base, attributes: [supportedSASLMechanisms]}}

  rootdse_excluded_from_subtree:
    kind: probe
    spec_refs:
      - {req_id: LDAP-cdfceb2d, keyword: MUST, axis: entries, step: 2, "excludes": [""]}
    steps:
      - {op: bind, args: {dn: "{A}", password: "{P}"}}
      - {op: search, args: {base: "", scope: one, filter: [present, objectClass], size_limit: 50}}

  # ---------------- census (12 Nov 2026): every testable ledger row not named above ----------------
  # Generated with the census authoring aid. Write fixtures bind as the target's admin and work under {B};
  # {U} is unique per fixture. Axes added the same day: attr_names, objectclasses, subschema_rdn_attr,
  # referral_shape, referral_uris, sasl_creds_present (tiers.yaml); driver ops burst and {@attr}.
  census_diagnostic_message:
    kind: control
    spec_refs:
      - {"req_id": "LDAP-e1fc8d1b", "keyword": "MUST", "axis": "diagnostic_present", "step": 1, "basis": "option", "note": "any diagnosticMessage the axis can show conforms"}
    steps:
      - {"op": "bind", "args": {"dn": "", "password": ""}}

  census_referral_object:
    requires: [arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-e7e0f45a", "keyword": "MUST", "axis": "referral_shape", "step": 3, "allowed": ["none", "uris"]}
      - {"req_id": "LDAP-e7e0f45a", "keyword": "MUST", "axis": "referral_shape", "step": 4, "allowed": ["none", "uris"]}
      - {"req_id": "LDAP-6c0c2b59", "keyword": "MUST", "axis": "referral_uris", "step": 3, "excludes_re": "^ldaps?://[^/]*/?(\\?|$)"}
      - {"req_id": "LDAP-bf9b278e", "keyword": "SHOULD", "axis": "referral_uris", "step": 3, "excludes_re": "^ldaps?://[^/]*/[^?]*(\\?[^?]*)?$"}
      - {"req_id": "LDAP-3e4afe57", "keyword": "MUST", "axis": "referral_uris", "step": 3, "excludes_re": " "}
      - {"req_id": "LDAP-0ee75f01", "keyword": "SHOULD", "axis": "referral_uris", "step": 4, "excludes_re": "^ldaps?://[^/]*/?(\\?|$)"}
      - {"req_id": "LDAP-d53a0f7a", "keyword": "SHOULD", "axis": "referral_uris", "step": 4, "excludes_re": "^ldaps?://[^/]*/[^?]*(\\?[^?]*)?$"}
      - {"req_id": "LDAP-3c33d568", "keyword": "MUST", "axis": "referral_uris", "step": 4, "excludes_re": " "}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U} ref,{B}", "attributes": [["objectClass", ["top", "referral", "extensibleObject"]], ["ou", ["{U} ref"]], ["ref", ["ldap://pd-elsewhere.invalid/ou=far%20away,dc=other"]]]}}
      - {"op": "search", "args": {"base": "{B}", "scope": "sub", "filter": ["eq", "ou", "{U} ref"]}}
      - {"op": "search", "args": {"base": "ou=below,ou={U} ref,{B}", "scope": "base"}}

  census_referral_alias:
    requires: [alias, arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-a19e95cb", "keyword": "MUST", "axis": "referral_uris", "step": 5, "excludes_re": "^ldaps?://[^/]*/?(\\?|$)"}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U}r2,{B}", "attributes": [["objectClass", ["top", "referral", "extensibleObject"]], ["ou", ["{U}r2"]], ["ref", ["ldap://pd-elsewhere.invalid/ou=far%20away,dc=other"]]]}}
      - {"op": "add", "args": {"dn": "cn={U}ra,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}ra"]], ["aliasedObjectName", ["ou={U}r2,{B}"]]]}}
      - {"op": "sleep", "window_ms": 200}
      - {"op": "search", "args": {"base": "cn={U}ra,{B}", "scope": "sub", "deref": "always"}}

  census_unbind_critical_control:
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-539b6ca5", "keyword": "MUST", "axis": "response_ops", "step": 2, "basis": "not-observable", "note": "the axis records response operations, not whether the server acted on the criticality"}
    steps:
      - {"op": "bind", "args": {"dn": "", "password": ""}}
      - {"op": "unbind", "window_ms": 800, "controls": [{"oid": "1.3.6.1.4.1.32473.1.1", "critical": true}]}

  census_no_intermediate_response:
    kind: control
    spec_refs:
      - {"req_id": "LDAP-6183df20", "keyword": "MUST", "axis": "response_ops", "step": 1, "allowed": [["BindResponse"]]}
      - {"req_id": "LDAP-6183df20", "keyword": "MUST", "axis": "response_ops", "step": 2, "allowed": [["SearchResultEntry", "SearchResultDone"]]}
    steps:
      - {"op": "bind", "args": {"dn": "", "password": ""}}
      - {"op": "search", "args": {"base": "", "scope": "base", "filter": ["present", "objectClass"], "attributes": ["supportedLDAPVersion"]}}

  census_bind_name_not_dereferenced:
    requires: [alias]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-7705e42d", "keyword": "MUST", "axis": "native_codes", "step": 3, "allowed": [[49], [32], [34], [53], [48], [50]], "when": {"axis": "native_codes", "step": 2, "allowed": [[0]]}}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "cn={U}ba,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}ba"]], ["aliasedObjectName", ["{A}"]]]}}
      - {"op": "bind", "args": {"dn": "cn={U}ba,{B}", "password": "{P}"}}

  census_bind_password_octets:
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-e0513457", "keyword": "MUST", "axis": "decision_class", "step": 3, "allowed": ["proceed"]}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "cn={U}pw,{B}", "attributes": [["objectClass", ["top", "person"]], ["cn", ["{U}pw"]], ["sn", ["pw"]], ["userPassword", ["pdéü-中文-\u0001x"]]]}}
      - {"op": "bind", "args": {"dn": "cn={U}pw,{B}", "password": "pdéü-中文-\u0001x"}}

  census_bind_with_outstanding_search:
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-a4e126cc", "keyword": "MUST", "axis": "response_ops", "step": 2, "order": ["SearchResultDone", "BindResponse"]}
      - {"req_id": "LDAP-27f8d5b6", "keyword": "SHOULD", "axis": "response_ops", "step": 3, "basis": "not-observable", "note": "whether a request was processed during the bind is not visible on the wire"}
    steps:
      - {"op": "bind", "args": {"dn": "", "password": ""}}
      - {"op": "burst", "args": {"requests": [{"op": "search", "args": {"base": "{B}", "scope": "sub"}}, {"op": "bind", "args": {"dn": "", "password": ""}}]}}
      - {"op": "burst", "args": {"requests": [{"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}, {"op": "search", "args": {"base": "", "scope": "base"}}]}}

  census_bind_simple_no_sasl_creds:
    kind: control
    spec_refs:
      - {"req_id": "LDAP-4009ee5c", "keyword": "MUST", "axis": "sasl_creds_present", "step": 1, "allowed": [[false]]}
      - {"req_id": "LDAP-4009ee5c", "keyword": "MUST", "axis": "sasl_creds_present", "step": 2, "allowed": [[false]]}
    steps:
      - {"op": "bind", "args": {"dn": "", "password": ""}}
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}

  census_bind_sasl_external_plain:
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-55499182", "keyword": "MUST", "axis": "sasl_creds_present", "step": 1, "allowed": [[false]]}
      - {"req_id": "LDAP-0f5c5282", "keyword": "MUST", "axis": "native_codes", "step": 2, "same_as": 1}
    steps:
      - {"op": "bind", "args": {"dn": "", "sasl": {"mechanism": "EXTERNAL"}}}
      - {"op": "bind", "args": {"dn": "cn=pd-garbage,dc=nowhere", "sasl": {"mechanism": "EXTERNAL"}}}

  census_proxied_authz_anonymous:
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-32c68348", "keyword": "MUST", "axis": "native_codes", "step": 2, "allowed": [[123], [12], [50], [53], [2], [48]]}
    steps:
      - {"op": "bind", "args": {"dn": "", "password": ""}}
      - {"op": "search", "args": {"base": "{B}", "scope": "base"}, "controls": [{"oid": "2.16.840.1.113730.3.4.18", "critical": true, "value": "dn:{A}"}]}

  census_simple_bind_cleartext:
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-0d9fbbd7", "keyword": "SHOULD", "axis": "native_codes", "step": 1, "allowed": [[13], [53], [48], [8]]}
      - {"req_id": "LDAP-1af34e1c", "keyword": "SHOULD", "axis": "native_codes", "step": 1, "allowed": [[13], [53], [48], [8]]}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}

  census_sasl_mechanisms:
    kind: control
    value_attrs: ["supportedsaslmechanisms"]
    spec_refs:
      - {"req_id": "LDAP-529fedb1", "keyword": "MAY", "axis": "entry_attrs", "step": 1, "basis": "option"}
    steps:
      - {"op": "search", "args": {"base": "", "scope": "base", "filter": ["present", "objectClass"], "attributes": ["supportedSASLMechanisms"]}}

  census_alias_modify:
    requires: [alias, arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-6cb0620e", "keyword": "MUST", "axis": "entry_attrs", "step": 5, "allowed": [[]], "note": "the target keeps no description: the alias entry, not its target, was modified or the request failed"}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U}t,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}t"]]]}}
      - {"op": "add", "args": {"dn": "cn={U}al,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}al"]], ["aliasedObjectName", ["ou={U}t,{B}"]]]}}
      - {"op": "modify", "args": {"dn": "cn={U}al,{B}", "changes": [{"op": "replace", "type": "description", "values": ["via-alias"]}]}}
      - {"op": "search", "args": {"base": "ou={U}t,{B}", "scope": "base", "attributes": ["description"]}}

  census_alias_add_under:
    requires: [alias, arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-8c9dcd06", "keyword": "MUST", "axis": "status", "step": 4, "allowed": ["fix-request", "stop", "authenticate", "redirect", "closed"]}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U}t,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}t"]]]}}
      - {"op": "add", "args": {"dn": "cn={U}al,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}al"]], ["aliasedObjectName", ["ou={U}t,{B}"]]]}}
      - {"op": "add", "args": {"dn": "ou={U}c,cn={U}al,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}c"]]]}}

  census_alias_delete:
    requires: [alias, arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-aba94a91", "keyword": "MUST", "axis": "entries", "step": 5, "allowed": [["ou={U}t"]]}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U}t,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}t"]]]}}
      - {"op": "add", "args": {"dn": "cn={U}al,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}al"]], ["aliasedObjectName", ["ou={U}t,{B}"]]]}}
      - {"op": "delete", "args": {"dn": "cn={U}al,{B}"}}
      - {"op": "search", "args": {"base": "ou={U}t,{B}", "scope": "base"}}

  census_alias_moddn_superior:
    requires: [alias, arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-dc4dbc8e", "keyword": "MUST", "axis": "status", "step": 5, "allowed": ["fix-request", "stop", "authenticate", "redirect", "closed"]}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U}t,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}t"]]]}}
      - {"op": "add", "args": {"dn": "cn={U}al,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}al"]], ["aliasedObjectName", ["ou={U}t,{B}"]]]}}
      - {"op": "add", "args": {"dn": "ou={U}m,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}m"]]]}}
      - {"op": "moddn", "args": {"dn": "ou={U}m,{B}", "newrdn": "ou={U}m", "newsuperior": "cn={U}al,{B}"}}

  census_alias_compare:
    requires: [alias, arbitrary-ou]
    kind: probe
    spec_refs:
      - {"req_id": "LDAP-7f9cfa31", "keyword": "MUST", "axis": "native_codes", "step": 4, "allowed": [[5], [16], [32], [33], [34], [36], [50], [53], [18], [64]]}
    steps:
      - {"op": "bind", "args": {"dn": "{A}", "password": "{P}"}}
      - {"op": "add", "args": {"dn": "ou={U}t,{B}", "attributes": [["objectClass", ["top", "organizationalUnit"]], ["ou", ["{U}t"]]]}}
      - {"op": "add", "args": {"dn": "cn={U}al,{B}", "attributes": [["objectClass", ["top", "alias", "extensibleObject"]], ["cn", ["{U}al"]], ["aliasedObjectName", ["ou={U}t,{B}"]]]}}
      - {"op": "compare", "args": {"dn": "cn={U}al,{B}", "attr": "ou", "value": "{U}t"}}

  census_alias_loop:
    requires: [alias]
    kind: probe
    spec_refs:
