# Unbound, lab deviations only: root hints, no validator module, access from the lab net, IPv4 lab, no chroot.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-ip6: no
  root-hints: "/conf/root.hints"
  module-config: "iterator"
  chroot: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
