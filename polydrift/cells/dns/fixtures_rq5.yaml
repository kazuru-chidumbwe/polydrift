# RQ5 known-bug fixtures, DNS cell (manuscript 4.4 and 4.6). Written from the bug reports named in
# polydrift/rq5/cases.yaml after the main set was complete; run only in recall runs (POLYDRIFT_FIXTURE_SET=rq5) and
# kept out of the RQ3 counts. Zone names rq5-* are in lab/zones.yaml.
fixtures:
  # D10, CVE-2021-25215 (ISC, 28 Apr 2021): a DNAME placed in the answer while chasing DNAMEs is itself the final
  # answer. rq5-self.pd.pdlab. DNAME pd.pdlab., so rq5-self.rq5-self.pd.pdlab. synthesises to rq5-self.pd.pdlab.,
  # whose DNAME answers the DNAME query. Asked twice (the second answer comes from the cache), then a plain name.
  rq5_d10_dname_self_answer:
    kind: probe
    clause: "RFC 6672 3.4 (recursive DNAME processing); RFC 1035 7.1"
    steps:
      - {qname: rq5-self.rq5-self.pd.pdlab, qtype: DNAME}
      - {qname: rq5-self.rq5-self.pd.pdlab, qtype: DNAME}
      - {qname: a.pd.pdlab, qtype: A}

  # D9, ResolFuzz: a DNAME owned by its own target (rq5-loop.pd.pdlab. DNAME rq5-loop.pd.pdlab.) makes every name
  # below it a CNAME to itself. PowerDNS Recursor 4.7.3 answered SERVFAIL after 32 records.
  rq5_d9_dname_self_loop:
    kind: probe
    clause: "RFC 6672 3.4; RFC 1034 5.2.2 alias loops"
    steps:
      - {qname: x.rq5-loop.pd.pdlab, qtype: A}
      - {qname: a.pd.pdlab, qtype: A}

  # D1, ResolverFuzz RC3: a forwarder that receives a query with RD=0 forwards it upstream, with RD set (Unbound
  # 1.17.1; fixed in 1.18.0: "refusing to send RD=0 queries to a forwarder, they still get answered from cache"). Forwarding
  # targets only (lab/resolvers/*-fwd*); the lab authority for pd.pdlab. is the forwarder's upstream and logs it.
  rq5_d1_rd0_forwarded:
    kind: probe
    clause: "RFC 1034 4.3.1 (recursive service only if asked via RD)"
    steps:
      - {op: upstream, match: rq5-rd0, id: up1}
      - {qname: rq5-rd0.pd.pdlab, qtype: A, rd: false}
      - {op: upstream, match: rq5-rd0, id: up2}

  # D6, MaginotDNS (USENIX Security 2023) V1 / ResolverFuzz CP1: a CDNS forwards the attacker's domain (forward
  # first) and the forwarder's answer carries an out-of-bailiwick delegation (other.pdlab. NS ns1.rogue.pdlab., glue
  # to .17). BIND 9.18.0 caches it (Q.zone starts at the root in forwarding mode) and sends the victim query to .17;
  # fixed in 9.18.1 (CVE-2021-25220). Forwarding targets only (lab/resolvers/*-fwd*).
  rq5_d6_cdns_bailiwick:
    kind: probe
    clause: "RFC 2181 5.4.1 (data ranking); RFC 1034 5.3.3 (bailiwick of referral data)"
    steps:
      - {op: upstream, match: rq5-cp1v, id: up0}
      - {qname: x.atk.pd.pdlab, qtype: A}
      - {qname: rq5-cp1v.other.pdlab, qtype: A}
      - {op: upstream, match: rq5-cp1v, id: up1}

  # D4, ResolverFuzz RC2: an answer for rq5-authx carries an A record for another name (rq5-inj) in its authority
  # section. A resolver that caches it answers rq5-inj from cache (6.6.6.9) instead of asking (10.0.67.2). Unbound
  # 1.18.0 added harden-unknown-additional (default no), so the default configuration keeps the behaviour.
  rq5_d4_authority_inject:
    kind: probe
    clause: "RFC 2181 5.4.1; RFC 1035 7.4 (unsolicited data)"
    steps:
      - {qname: rq5-authx.pd.pdlab, qtype: A}
      - {qname: rq5-inj.pd.pdlab, qtype: A}

  # D14, TuDoor (IEEE S&P 2024) VDS: the upstream answer is preceded by a malformed packet on the same four-tuple
  # (short payload under 12 octets, empty payload, a wrong transaction ID, the query echoed with QR=0), the valid
  # answer follows 300 ms later. A resolver that takes the bad packet as the reply fails the query (SERVFAIL, then
  # negative caching); Technitium fixed this in 11.0.3 (CHANGELOG 11 Mar 2023, reported by Xiang Li, NISL).
  rq5_d14_tudoor_vds:
    kind: probe
    clause: "RFC 5452 4.1 to 4.3 (accept only a matching response); RFC 1035 7.3"
    steps:
      - {qname: rq5-mal-short.pd.pdlab, qtype: A}
      - {qname: rq5-mal-empty.pd.pdlab, qtype: A}
      - {qname: rq5-mal-txid.pd.pdlab, qtype: A}
      - {qname: rq5-mal-qr0.pd.pdlab, qtype: A}

  # D13, ResolverFuzz RC7: the authority answers over UDP with TC set and closes every TCP connection without a
  # reply. Knot Resolver before 5.6.0 reconnected up to about 100 times per client query (NEWS 5.6.0, !1380:
  # "a DNS server that just closes connections without answer could cause lots of work for the resolver").
  rq5_d13_tcp_null:
    kind: probe
    clause: "RFC 1035 7.2 (bounded retransmission); RFC 7766 6.2.2"
    steps:
      - {op: upstream, match: rq5-tcpnull, id: up1}
      - {qname: rq5-tcpnull.pd.pdlab, qtype: A, timeout: 15}
      - {op: sleep, ms: 3000}
      - {op: upstream, match: rq5-tcpnull, volume: true, id: up2}

  # D5, Phoenix Domain T2 (NDSS 2023; ResolverFuzz CP4): iterative subdomain delegation. ghost.pdlab. is delegated
  # for 6 s and revoked by its parent 2 s after the first query; its server answers s.ghost with a child delegation
  # (TTL 3600) pointing back at itself. After the parent delegation has expired, x.s.ghost resolves only for a
  # resolver that kept the child delegation (Unbound fixed in 1.16.2, CVE-2022-30698); b.ghost shows the revocation.
  rq5_d5_ghost_subdomain:
    kind: probe
    clause: "RFC 1034 4.3.2, RFC 2181 5.4.1 (data ranking; a child cannot extend its own delegation)"
    steps:
      - {qname: a.ghost.pdlab, qtype: A}
      - {qname: s.ghost.pdlab, qtype: A}
      - {op: sleep, ms: 9000}
      - {qname: x.s.ghost.pdlab, qtype: A}
      - {qname: b.ghost.pdlab, qtype: A}
