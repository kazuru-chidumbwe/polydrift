// BIND 9, lab deviations only: root hints, validation off, recursion and queries open to the lab net, IPv4 lab.
options {
  directory "/var/cache/bind";
  recursion yes;
  allow-query { any; };
  allow-recursion { any; };
  allow-query-cache { any; };
  dnssec-validation no;
  listen-on { any; };
  listen-on-v6 { none; };
};
zone "." { type hint; file "/conf/root.hints"; };
