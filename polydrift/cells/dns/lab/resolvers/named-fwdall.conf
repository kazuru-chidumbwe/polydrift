// BIND 9 as a forwarder (forwarding-role cell): forward only, everything to the lab recursive upstream at .54.
options {
  directory "/var/cache/bind";
  recursion yes;
  allow-query { any; };
  allow-recursion { any; };
  allow-query-cache { any; };
  dnssec-validation no;
  listen-on { any; };
  listen-on-v6 { none; };
  forward only;
  forwarders { 172.31.53.54; };
};
