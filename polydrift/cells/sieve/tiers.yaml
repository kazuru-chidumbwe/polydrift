# Sieve cell: axis -> tier (manuscript 3.3). Consumer: the mail user (where the message is, what was sent on their
# behalf) and the operator who wrote the script.
cell: sieve
refusal_class: null
axes:
  decision_class:
    tier: 1
    kappa: identity
    clause: "T1: a script that does not compile leaves the operator to fix it (fix-request); one that compiles runs (proceed)"
  outcome:
    tier: 1
    kappa: identity
    clause: "T1: ok, refused at compile time, or failed at run time; the operator acts on each differently"
  compile_class:
    tier: 3
    kappa: identity
    clause: "T3: which kind of compile error (unknown extension, syntax, other); the operator fixes the script either way"
  intent:
    tier: 2
    kappa: identity
    clause: "T2: the action set the interpreter decides on (keep, fileinto, redirect, reject, discard, vacation)"
  stored:
    tier: 2
    kappa: identity
    clause: "T2: the folders the message is in after delivery; the user finds it there or does not (effect layer)"
  emitted:
    tier: 2
    kappa: identity
    clause: "T2: messages sent on the user's behalf (redirect, reject, vacation, DSN), by kind and recipients (effect layer)"
  stored_flags:
    tier: 2
    clause: "T2: IMAP flags on the stored message per folder; the user's client shows and filters by them (RFC 5232, effect layer)"
  emitted_headers:
    tier: 2
    clause: "T2: header facts of each sent message (Received count, In-Reply-To, Subject, From, To, Date, envelope sender, MDN disposition, DSN action): the recipient's software acts on them (effect layer)"
  lmtp_reply:
    tier: 2
    clause: "T2: the LMTP/SMTP reply to the delivery (code class, enhanced code, line count and length): the sending MTA bounces or delivers on it (phase 2 engines, effect layer)"
  redirect_received_more:
    tier: 2
    clause: "T2: each redirected message has more Received fields than the message as received (RFC 5228 4.2; loop detection downstream)"
  redirect_env_from:
    tier: 2
    clause: "T2: envelope sender of each redirected message (RFC 5228 4.2: an empty sender stays empty; bounces go there)"
  vacation_env_from:
    tier: 2
    clause: "T2: envelope sender of each vacation response (RFC 5230 5.1: SHOULD be <>, so no auto-reply loops)"
  vacation_in_reply_to:
    tier: 2
    clause: "T2: each vacation reply's In-Reply-To names the original Message-ID (RFC 5230 5.8); threading clients rely on it"
  vacation_subject:
    tier: 3
    clause: "T3: Subject of each vacation reply (RFC 5230 4.3, 5.3)"
  vacation_subject_encoded:
    tier: 2
    clause: "T2: Subject of each vacation reply uses RFC 2047 encoded words (iff non-ASCII, RFC 5230 4.3)"
  vacation_date:
    tier: 3
    clause: "T3: Date field present in each vacation reply (RFC 5230 5.2)"
  vacation_from:
    tier: 2
    clause: "T2: From of each vacation reply (RFC 5230 5.4): the recipient replies to it"
  vacation_to:
    tier: 2
    clause: "T2: To of each vacation reply (RFC 5230 5.5)"
  pre_vacation_sent:
    tier: 3
    clause: "T3: the deliveries before the measured one caused a vacation reply (precondition of the response-tracking rows, RFC 5230 4.2)"
  vacation_notify_never:
    tier: 3
    clause: "T3: the vacation reply asks for no delivery notifications (RCPT NOTIFY=NEVER, RFC 5230 5.1); the sender's MTA would otherwise report on an automatic reply"
  reject_text_extra:
    tier: 3
    clause: "T3: the refusal notice's human-readable part says, beyond the reason, that a filter refused the message (RFC 5429 2.2.1)"
  notice_has_script_edit:
    tier: 2
    clause: "T2: the refusal notice returns the message as received, not as the script edited it (RFC 5429 2.4); the sender sees what was refused"
  mdn_disposition:
    tier: 2
    clause: "T2: Disposition field of each reject MDN (RFC 5429 2.2.1)"
  dsn_action:
    tier: 2
    clause: "T2: Action field of each ereject DSN (RFC 5429 2.1.2)"
  reason_in_text:
    tier: 2
    clause: "T2: the reject/ereject reason reaches the human-readable text of the notification (RFC 5429 2.1.2)"
volatile: []
